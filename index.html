<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>نبرد تک‌ضربه‌ای</title>
<style>
:root{
  --glass-lite:rgba(14,22,38,.42);
  --glass-mid:rgba(14,22,38,.58);
  --glass-dark:rgba(12,18,32,.78);
  --border-soft:rgba(140,200,255,.28);
  --border-hi:rgba(140,200,255,.6);
  --accent:#7ec8ff;
  --accent-2:#a08aff;
  --warn:#ffd76a;
  --danger:#ff5a5a;
  --ok:#6dff8c;
  --text:#eef4ff;
  --text-dim:#8ea6c8;
  --text-mid:#cfe1ff;
  --sa-top:env(safe-area-inset-top,0px);
  --sa-bot:env(safe-area-inset-bottom,0px);
  --sa-left:env(safe-area-inset-left,0px);
  --sa-right:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;overflow:hidden;background:#050810;color:var(--text);
  font-family:Tahoma,Verdana,sans-serif;
  user-select:none;-webkit-user-select:none;
  touch-action:none;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;-webkit-touch-callout:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
canvas.game{display:block;position:fixed;top:0;left:0;touch-action:none;z-index:1}

.hudBar{
  position:fixed;top:calc(8px + var(--sa-top));left:calc(8px + var(--sa-left));
  display:flex;gap:5px;align-items:center;
  padding:5px 9px;border-radius:10px;
  background:var(--glass-lite);
  border:1px solid var(--border-soft);
  backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:0 4px 14px rgba(0,0,0,.4);
  font-size:10.5px;font-weight:bold;z-index:5;pointer-events:none;
  transition:opacity .3s;
}
.hudBar.off{opacity:0}
.hudItem{display:flex;align-items:center;gap:4px;white-space:nowrap}
.hudIco{width:12px;height:12px;flex-shrink:0;filter:drop-shadow(0 0 4px currentColor)}
.hudSep{width:1px;height:13px;background:rgba(140,200,255,.18);flex-shrink:0}
.kKills{color:var(--warn)}.kDeaths{color:#ff8a8a}
.kLevel{color:var(--accent)}.kEnemies{color:#ffbf80}
.hudLvlWrap{display:flex;flex-direction:column;gap:2px}
.hudLvlBar{position:relative;width:38px;height:3px;border-radius:2px;background:rgba(120,180,255,.16);overflow:hidden}
.hudLvlFill{position:absolute;inset:0;width:0%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--warn));box-shadow:0 0 6px rgba(255,215,106,.7);transition:width .35s}
.hudLvlBar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:hudShine 2.4s ease-in-out infinite}
@keyframes hudShine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

.statBar{
  position:fixed;top:calc(42px + var(--sa-top));left:calc(8px + var(--sa-left));
  display:flex;gap:3px;align-items:center;flex-wrap:wrap;
  padding:3px 5px;border-radius:9px;
  background:var(--glass-lite);
  border:1px solid var(--border-soft);
  backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);
  font-size:9.5px;font-weight:bold;z-index:5;
  box-shadow:0 4px 12px rgba(0,0,0,.4);pointer-events:none;
  max-width:calc(100vw - 130px);
  transition:opacity .3s;
}
.statBar.off{opacity:0}
.statPill{display:flex;align-items:center;gap:3px;padding:2px 6px;border-radius:6px;background:rgba(30,45,75,.5);white-space:nowrap;color:var(--text-mid)}
.statPill .v{color:#fff;font-family:'Courier New',monospace;font-size:10px}
.sHp .v{color:#ff9d9d}.sPow .v{color:var(--warn)}.sSpd .v{color:#a6f0ff}
.sMov .v{color:#a8ffb5}.sLvl .v{color:#ffd0ff}

.topRight{position:fixed;top:calc(8px + var(--sa-top));right:calc(8px + var(--sa-right));display:flex;gap:5px;z-index:6}
.iconBtn{
  width:34px;height:34px;border-radius:10px;
  background:var(--glass-lite);border:1px solid var(--border-soft);
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  color:var(--text-mid);display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.4);transition:all .2s;
}
.iconBtn svg{width:17px;height:17px}
.iconBtn:active{transform:scale(.92);background:rgba(126,200,255,.18);border-color:var(--border-hi);color:#fff}

.connBadge{
  position:fixed;top:calc(48px + var(--sa-top));right:calc(8px + var(--sa-right));
  display:flex;gap:5px;align-items:center;
  font-size:9.5px;font-weight:bold;padding:3px 8px;border-radius:7px;
  background:var(--glass-lite);border:1px solid var(--border-soft);
  color:var(--ok);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  z-index:5;pointer-events:none;transition:.2s;
}
.connBadge.warn{color:var(--warn);border-color:rgba(255,215,106,.4)}
.connBadge.err{color:var(--danger);border-color:rgba(255,90,90,.4)}
.connDot{width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;animation:connPulse 1.6s infinite}
@keyframes connPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.75)}}

.minimapWrap{
  position:fixed;top:calc(72px + var(--sa-top));right:calc(8px + var(--sa-right));
  z-index:7;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:3px;
}
.minimapFrame{
  position:relative;width:76px;height:76px;border-radius:50%;
  border:1.5px solid rgba(140,200,255,.5);
  box-shadow:0 3px 12px rgba(0,0,0,.5),inset 0 0 14px rgba(80,140,255,.22),0 0 16px rgba(126,200,255,.2);
  overflow:hidden;
}
.minimapFrame::before{content:'';position:absolute;inset:-2px;border-radius:50%;border:1px dashed rgba(140,200,255,.28);animation:mmSpin 16s linear infinite;pointer-events:none}
@keyframes mmSpin{to{transform:rotate(360deg)}}
#minimap{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(10,20,40,.95) 0%,rgba(6,12,22,.99) 100%);display:block}
.coordLabel{font-family:'Courier New',monospace;font-size:8.5px;font-weight:bold;color:var(--accent);background:var(--glass-lite);padding:2px 6px;border-radius:5px;border:1px solid var(--border-soft);white-space:nowrap;direction:ltr;backdrop-filter:blur(8px)}

.teamBadge{
  position:fixed;bottom:calc(150px + var(--sa-bot));left:calc(8px + var(--sa-left));
  z-index:5;padding:4px 9px;border-radius:8px;font-size:10px;font-weight:bold;
  background:var(--glass-mid);border:1.5px solid hsl(210,85%,55%);color:hsl(210,85%,78%);
  backdrop-filter:blur(12px);display:none;align-items:center;gap:5px;
  box-shadow:0 0 12px hsla(210,85%,55%,.4);pointer-events:none;
}
.teamBadge.on{display:flex}
.teamBadge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}

.chatStage{
  position:fixed;bottom:calc(150px + var(--sa-bot));right:calc(8px + var(--sa-right));
  max-width:min(230px, 62vw);
  z-index:7;display:flex;flex-direction:column;gap:4px;
  pointer-events:none;align-items:flex-end;
}
.chatBubble{
  font-size:11px;padding:5px 10px;
  background:var(--glass-dark);
  border-radius:11px 11px 3px 11px;
  color:var(--text);border-left:3px solid var(--accent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 3px 10px rgba(0,0,0,.5);
  max-width:100%;line-height:1.5;direction:rtl;text-align:right;
  animation:chatIn .3s cubic-bezier(.4,0,.2,1);
  transition:opacity .5s ease,transform .5s ease;
  word-break:break-word;will-change:opacity,transform;
}
.chatBubble b{color:var(--warn);font-weight:bold}
.chatBubble.leaving{opacity:0;transform:translateX(10px)}
@keyframes chatIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}

.joyDemo{
  position:fixed;
  top:0;left:0;
  width:106px;height:106px;
  z-index:10;pointer-events:none;
}
.joyRing{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(30,50,90,.32) 0%,rgba(20,35,65,.18) 55%,rgba(120,180,255,.06) 100%);
  border:1.5px solid rgba(140,200,255,.45);
  box-shadow:inset 0 0 22px rgba(80,140,255,.2),0 5px 18px rgba(0,0,0,.45);
  backdrop-filter:blur(4px);
}
.joyRing::before{content:'';position:absolute;inset:7px;border-radius:50%;border:1px dashed rgba(140,200,255,.2)}
.joyKnob{
  position:absolute;top:50%;left:50%;width:46px;height:46px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95) 0%,rgba(126,200,255,.75) 42%,rgba(40,90,180,.65) 100%);
  box-shadow:0 0 18px rgba(126,200,255,.55),inset 0 -4px 10px rgba(0,0,0,.3),inset 0 4px 8px rgba(255,255,255,.4);
  border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(6px);
}
.joyKnob::after{content:'';position:absolute;top:7px;left:8px;width:14px;height:9px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(3px)}

.actionsZone{
  position:fixed;bottom:calc(20px + var(--sa-bot));right:calc(14px + var(--sa-right));
  display:flex;align-items:flex-end;gap:14px;z-index:10;pointer-events:none;
}
.actionBtn{
  position:relative;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-weight:bold;color:#fff;transition:transform .12s ease;
  pointer-events:auto;backdrop-filter:blur(12px) saturate(1.5);-webkit-backdrop-filter:blur(12px) saturate(1.5);
  overflow:hidden;
}
.actionBtn::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.5) 0%,rgba(255,255,255,.05) 42%,transparent 70%);
  pointer-events:none;
}
.actionBtn .ico{width:36%;height:36%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));transition:transform .22s ease;position:relative;z-index:1}
.actionBtn .lbl{font-size:10.5px;letter-spacing:.3px;text-shadow:0 2px 4px rgba(0,0,0,.75);position:relative;z-index:1}
.actionBtn:active{transform:scale(.94)}

.btnAttack{
  width:80px;height:80px;
  background:linear-gradient(160deg,rgba(255,200,140,.55) 0%,rgba(230,110,50,.5) 55%,rgba(160,40,15,.55) 100%);
  border:1.5px solid rgba(255,200,140,.6);
  box-shadow:0 0 0 3px rgba(255,180,110,.18),0 0 22px rgba(255,140,60,.4),0 6px 18px rgba(0,0,0,.5),inset 0 -4px 12px rgba(0,0,0,.22),inset 0 4px 10px rgba(255,255,255,.2);
}
.btnAttack:active .ico{transform:scale(1.15) rotate(-8deg)}

.btnDash{
  width:62px;height:62px;
  background:linear-gradient(160deg,rgba(200,235,255,.55) 0%,rgba(90,170,255,.5) 55%,rgba(25,60,140,.55) 100%);
  border:1.5px solid rgba(180,225,255,.6);
  box-shadow:0 0 0 2.5px rgba(126,200,255,.22),0 0 18px rgba(90,170,255,.4),0 5px 16px rgba(0,0,0,.45),inset 0 -3px 9px rgba(0,0,0,.22),inset 0 3px 8px rgba(255,255,255,.25);
}
.btnDash .lbl{font-size:9.5px}
.btnDash:active .ico{transform:translateX(-3px) scale(1.1)}

.cdRing{
  position:absolute;inset:-4px;border-radius:50%;pointer-events:none;z-index:0;
  background:conic-gradient(rgba(200,235,255,.85) 0deg,rgba(200,235,255,.85) 0deg,transparent 0deg);
  -webkit-mask:radial-gradient(circle closest-side, transparent 78%, #000 82% 96%, transparent 100%);
          mask:radial-gradient(circle closest-side, transparent 78%, #000 82% 96%, transparent 100%);
  display:none;
}
.cdRing.on{display:block}

body[data-char="warrior"] .btnAttack{
  background:linear-gradient(160deg,rgba(180,230,255,.55) 0%,rgba(80,160,240,.5) 55%,rgba(20,60,140,.55) 100%);
  border-color:rgba(180,230,255,.65);
}
body[data-char="knight"] .btnAttack{
  background:linear-gradient(160deg,rgba(255,235,170,.58) 0%,rgba(230,180,60,.5) 55%,rgba(140,90,10,.55) 100%);
  border-color:rgba(255,235,170,.65);
}
body[data-char="archer"] .btnAttack{
  background:linear-gradient(160deg,rgba(200,255,215,.55) 0%,rgba(90,210,140,.5) 55%,rgba(20,100,50,.55) 100%);
  border-color:rgba(180,255,205,.65);
}
body[data-char="tank"] .btnAttack{
  background:linear-gradient(160deg,rgba(255,215,180,.55) 0%,rgba(230,130,70,.5) 55%,rgba(140,50,15,.55) 100%);
  border-color:rgba(255,215,180,.65);
}

.toastEl{
  position:fixed;top:calc(80px + var(--sa-top));left:50%;transform:translateX(-50%) translateY(-12px);
  padding:7px 15px;border-radius:20px;font-weight:bold;font-size:11px;
  background:linear-gradient(135deg,rgba(255,215,100,.96),rgba(255,150,60,.96));
  color:#1a1005;box-shadow:0 6px 22px rgba(255,180,60,.5),inset 0 0 0 1px rgba(255,255,255,.35);
  z-index:60;display:flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .3s,transform .3s;
}
.toastEl.on{opacity:1;transform:translateX(-50%) translateY(0)}

.chatInputWrap{
  position:fixed;bottom:calc(8px + var(--sa-bot));left:12px;right:12px;
  z-index:20;display:none;gap:8px;align-items:center;
}
.chatInputWrap.on{display:flex}
#chatInput{flex:1;padding:11px 14px;font-size:16px;font-family:inherit;
  background:rgba(10,18,32,.95);border:1px solid rgba(120,180,255,.4);
  border-radius:12px;color:var(--text);outline:none;direction:rtl}
#chatInput:focus{border-color:var(--border-hi);box-shadow:0 0 0 3px rgba(120,180,255,.15)}
#chatSend{padding:11px 16px;border-radius:12px;font-weight:bold;
  background:linear-gradient(135deg,rgba(70,140,255,.95),rgba(160,90,255,.95));
  color:#fff;font-size:13px}

.lbModal{position:fixed;inset:0;z-index:50;display:none;
  background:rgba(3,5,10,.72);backdrop-filter:blur(8px);
  align-items:center;justify-content:center;padding:20px}
.lbModal.on{display:flex}
.lbCard{width:100%;max-width:420px;
  background:linear-gradient(170deg,rgba(16,26,44,.97),rgba(8,12,22,.99));
  border:1px solid rgba(120,180,255,.28);border-radius:18px;padding:18px;
  box-shadow:0 24px 70px rgba(0,0,0,.8);max-height:80vh;overflow-y:auto}
.lbTitle{font-size:16px;font-weight:bold;text-align:center;margin-bottom:12px;color:var(--accent);
  display:flex;align-items:center;justify-content:center;gap:7px}
.lbRow{display:grid;grid-template-columns:32px 1fr auto auto;gap:8px;align-items:center;
  padding:8px 10px;border-radius:9px;font-size:12px;margin-bottom:3px;background:rgba(20,30,50,.5)}
.lbRow.me{background:linear-gradient(90deg,rgba(126,200,255,.18),rgba(160,90,255,.14));border:1px solid rgba(140,200,255,.5)}
.lbRank{font-weight:bold;color:var(--warn);text-align:center;font-size:13px}
.lbRank.gold{color:#ffd700}.lbRank.silver{color:#c0c0c0}.lbRank.bronze{color:#cd7f32}
.lbName{font-weight:bold;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbStat{color:var(--accent);font-size:11px;font-weight:bold;font-family:'Courier New',monospace}
.lbTeam{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:bold;color:#fff}
.lbClose{width:100%;margin-top:12px;padding:11px;border-radius:10px;border:1px solid rgba(140,200,255,.5);
  background:linear-gradient(135deg,rgba(70,140,255,.85),rgba(160,90,255,.85));
  color:#fff;font-weight:bold;font-size:13px}

.disconnectOverlay{position:fixed;inset:0;z-index:80;display:none;
  align-items:center;justify-content:center;background:rgba(3,5,10,.78);backdrop-filter:blur(6px);padding:20px}
.disconnectOverlay.on{display:flex}
.discCard{width:100%;max-width:340px;text-align:center;
  background:linear-gradient(170deg,rgba(16,26,44,.97),rgba(8,12,22,.99));
  border:2px solid rgba(255,90,90,.5);border-radius:18px;padding:22px 20px;
  box-shadow:0 24px 70px rgba(0,0,0,.8)}
.discTitle{font-size:20px;font-weight:bold;color:var(--danger);margin-bottom:10px}
.discMsg{font-size:12.5px;color:var(--text-mid);margin-bottom:14px;line-height:1.7}
.discBtn{width:100%;padding:13px;border-radius:12px;border:none;
  background:linear-gradient(135deg,rgba(70,140,255,.95),rgba(160,90,255,.95));
  color:#fff;font-weight:bold;font-size:14px;box-shadow:0 6px 24px rgba(90,150,255,.5)}
.discBtn:active{transform:scale(.97)}
.discBtn.secondary{margin-top:8px;background:rgba(30,40,60,.9);border:1px solid rgba(150,170,200,.35);box-shadow:none;color:var(--text-mid);font-size:12.5px;padding:11px}
.discStatus{font-size:11px;color:var(--text-dim);margin-top:12px;font-family:monospace;direction:ltr}

#menu{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:12px;background:radial-gradient(circle at 50% 35%,rgba(20,45,90,.96),rgba(3,5,10,.99));
  transition:opacity .5s;overflow-y:auto}
#menu.hide{opacity:0;pointer-events:none}
.menuCard{width:100%;max-width:520px;
  background:linear-gradient(170deg,rgba(16,26,44,.92),rgba(8,12,22,.96));
  border:1px solid rgba(120,180,255,.24);border-radius:20px;padding:16px 14px;
  box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 60px rgba(70,140,255,.12) inset;
  display:flex;flex-direction:column;gap:10px;
  backdrop-filter:blur(14px);position:relative}
.menuTitle{font-size:clamp(22px,5vw,30px);letter-spacing:1.2px;text-align:center;
  background:linear-gradient(90deg,#7ec8ff,#ffd76a,#ff7ad9,#7ec8ff);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2;font-weight:900;
  animation:titleGlow 4s linear infinite}
@keyframes titleGlow{to{background-position:200% center}}
.menuSub{text-align:center;color:var(--text-dim);font-size:10px;letter-spacing:5px;margin-top:-4px;font-weight:bold}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:#8ba3c4;font-weight:bold;letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.field label::before{content:'';width:3px;height:11px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
.field input{width:100%;padding:10px 12px;font-size:15px;font-family:inherit;
  background:rgba(10,18,32,.8);border:1px solid rgba(120,180,255,.22);
  border-radius:11px;color:var(--text);outline:none;transition:.2s}
.field input:focus{border-color:var(--border-hi);box-shadow:0 0 0 3px rgba(120,180,255,.14)}
.modeRow{display:flex;gap:7px}
.modeBtn{flex:1;padding:10px;font-family:inherit;font-size:12px;font-weight:bold;
  background:rgba(10,18,32,.75);color:var(--text-dim);border:1px solid rgba(120,180,255,.18);
  border-radius:11px;transition:.22s;display:flex;align-items:center;justify-content:center;gap:7px}
.modeBtn svg{width:14px;height:14px}
.modeBtn.on{background:linear-gradient(135deg,rgba(70,140,255,.5),rgba(160,90,255,.5));
  color:#fff;border-color:rgba(140,200,255,.7);box-shadow:0 0 16px rgba(126,200,255,.3)}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.charCard{cursor:pointer;padding:9px 4px;border-radius:12px;text-align:center;
  background:rgba(10,18,32,.7);border:2px solid rgba(120,180,255,.14);
  transition:.22s;display:flex;flex-direction:column;align-items:center;gap:5px}
.charCard.on{border-color:rgba(255,215,100,.88);
  box-shadow:0 0 0 3px rgba(255,215,100,.15),0 0 22px rgba(255,215,100,.4);
  background:rgba(30,42,68,.85);transform:translateY(-2px)}
.charIcon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:rgba(0,0,0,.72);box-shadow:inset 0 -4px 10px rgba(0,0,0,.4),inset 0 4px 8px rgba(255,255,255,.25);
  border:1.5px solid rgba(255,255,255,.3);transition:transform .3s}
.charIcon svg{width:22px;height:22px}
.charCard.on .charIcon{transform:scale(1.08)}
.charName{font-size:11px;font-weight:bold;color:#d7e5fa}
.charDesc{font-size:8.5px;color:var(--text-dim);line-height:1.2}

<script>
(function(){
'use strict';

/* ═══ ابزارهای پایه ═══ */
const storage = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}

function faNum(v){
  const s = String(v);
  if(s==='NaN'||s==='undefined'||s==='null'||s==='Infinity'||s==='-Infinity')return '۰';
  return s.replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[+d]);
}
function faNumF(v,d){
  const n = Number(v);
  if(!isFinite(n))return '۰';
  return faNum(n.toFixed(d||0));
}

const CFG = {
  worldSize:3800, playerSpeed:240, swordRange:82, swordArc:1.05, swordCd:0.46,
  dashSpeed:900, dashDur:0.15, dashCd:2.5, arrowSpeed:950,
  respawnTime:2.5, respawnProt:2.5, initialProt:2.5,
  emergeDuration:1.2, interpDelayMs:100, maxSnapshots:12, errorSmoothing:0.00002,
  waveSpeed:520, waveLife:0.9, waveRangeMul:1.4
};
let WSZ = CFG.worldSize;

const TAU = Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const isFiniteNum=v=>typeof v==='number'&&isFinite(v);
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d}
function normAng(a){a%=TAU;if(a>Math.PI)a-=TAU;if(a<-Math.PI)a+=TAU;return a}
function hash01(n){const s=Math.sin(n*12.9898)*43758.5453;return s-Math.floor(s)}
function wrap(v){v%=WSZ;if(v<0)v+=WSZ;return v}
function wrapDelta(a,b){let d=(a-b)%WSZ;if(d>WSZ/2)d-=WSZ;if(d<-WSZ/2)d+=WSZ;return d}
function closestPointOnSegment(px,py,ax,ay,bx,by){
  const abx=bx-ax,aby=by-ay;
  const denom=abx*abx+aby*aby;
  let t=0;
  if(denom>0.0001)t=clamp(((px-ax)*abx+(py-ay)*aby)/denom,0,1);
  const cx=ax+abx*t,cy=ay+aby*t;
  const dx=px-cx,dy=py-cy;
  return {x:cx,y:cy,d2:dx*dx+dy*dy};
}
function pointInPolygon(pts,px,py){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i].x,yi=pts[i].y,xj=pts[j].x,yj=pts[j].y;
    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}

/* ═══ شخصیت‌ها ═══ */
const CHARACTERS = {
  warrior:{id:'warrior',hue:205,name:'شمشیرزن',desc:'متعادل',speed:1.00,cd:1.00,dash:1.00,range:1.00},
  knight:{id:'knight',hue:42,name:'شوالیه',desc:'قوی و کند',speed:0.88,cd:1.06,dash:0.85,range:1.18},
  archer:{id:'archer',hue:140,name:'کماندار',desc:'برد بالا',speed:1.05,cd:0.85,dash:1.10,range:2.40,ranged:true},
  tank:{id:'tank',hue:15,name:'مقاوم',desc:'سپر جذب',speed:0.82,cd:1.12,dash:0.78,range:1.10,shield:true}
};
const CHAR_LIST = ['warrior','knight','archer','tank'];

const CHAR_KIT = {
  warrior:{
    atkLbl:'شمشیر',dashLbl:'تیغ‌باد',
    atk:`<path d="M24 3 L28 11 L28 30 L24 38 L20 30 L20 11 Z"/><rect x="12" y="30" width="24" height="3" rx="1.4"/><rect x="22" y="33" width="4" height="8" rx="1.2"/><circle cx="24" cy="43" r="2.5"/>`,

  },

    atk:`<rect x="22" y="20" width="4" height="24" rx="2"/><circle cx="24" cy="13" r="9"/><path d="M24 1 L27 6 L21 6 Z M24 25 L27 20 L21 20 Z M11 13 L16 10 L16 16 Z M37 13 L32 10 L32 16 Z"/>`,
    dash:`<circle cx="24" cy="24" r="9"/><path d="M24 4 v8 M24 36 v8 M4 24 h8 M36 24 h8 M10 10 l6 6 M32 32 l6 6 M10 38 l6 -6 M32 16 l6 -6"/>`
  },
  archer:{
    atkLbl:'کمان',dashLbl:'پیکان',
    atk:`<path d="M14 6 Q36 24 14 42"/><line x1="14" y1="6" x2="14" y2="42" opacity=".45"/><line x1="10" y1="24" x2="42" y2="24"/><path d="M42 24 L35 20 L35 28 Z" fill="currentColor" stroke="none"/>`,
    dash:`<path d="M8 24 L36 24"/><path d="M36 24 L28 18 L28 30 Z" fill="currentColor" stroke="none"/><path d="M4 17 L14 17 M4 31 L14 31" opacity=".6"/>`
  },
  tank:{
    atkLbl:'سپر',dashLbl:'لغزش',
    atk:`<path d="M24 4 L42 10 L42 23 Q42 37 24 44 Q6 37 6 23 L6 10 Z"/><path d="M24 14 L28.5 20 L24 33 L19.5 20 Z" fill="#0a1220" stroke="none"/>`,
    dash:`<path d="M12 6 L20 10 L20 20 Q20 30 12 36 Q4 30 4 20 L4 10 Z"/><path d="M26 12 h16 M26 24 h16 M26 36 h16"/>`
  }
};

const TEAMS = {
  ffa:{id:'ffa',hue:null,name:'آزاد'},red:{id:'red',hue:0,name:'قرمز'},
  orange:{id:'orange',hue:28,name:'نارنجی'},yellow:{id:'yellow',hue:52,name:'زرد'},
  green:{id:'green',hue:130,name:'سبز'},blue:{id:'blue',hue:210,name:'آبی'},
  indigo:{id:'indigo',hue:250,name:'نیلی'},violet:{id:'violet',hue:285,name:'بنفش'}
};
const TEAM_LIST = ['ffa','red','orange','yellow','green','blue','indigo','violet'];
const PALETTE = [0,30,55,90,130,170,210,250,285,320];

const MONSTER_TYPES = {
  slime:{id:'slime',radius:16,hue:135,wobble:1.4,speed:75,dmg:1,xp:1,hp:1},
  skeleton:{id:'skeleton',radius:16,hue:205,wobble:0,speed:100,dmg:1,xp:1,hp:1},
  demon:{id:'demon',radius:17,hue:8,wobble:0,speed:110,dmg:1,xp:2,hp:1},
  ghost:{id:'ghost',radius:15,hue:275,wobble:0.9,speed:85,dmg:1,xp:1,hp:1,ghost:true},
  golem:{id:'golem',radius:28,hue:28,wobble:0.2,speed:55,dmg:1,xp:3,hp:1},
  wraith:{id:'wraith',radius:16,hue:295,wobble:0.6,speed:95,dmg:1,xp:2,hp:1,teleport:true}
};
const MT_LIST = Object.values(MONSTER_TYPES);

const AURA_LEVEL = 15;
const AURA_TYPE = {warrior:'smoke',knight:'ice',archer:'lightning',tank:'ice'};
const AURA_INTERVAL = {warrior:260,knight:300,archer:220,tank:320};

/* ═══ بوم ═══ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W=0,H=0,DPR=1,currentViewScale=1;
function computeViewScale(){currentViewScale=clamp(Math.min(W,H)/780,0.6,1.2)}
function viewScale(){return currentViewScale}

const obstacles=[],PORTALS=[],decors=[],particles=[],rings=[],localArrows=[];
const MAX_PARTICLES=400;
let time=0,shake=0,screenFlash=0;
const cam={x:0,y:0};

const player={
  x:0,y:0,vx:0,vy:0,angle:0,correctX:0,correctY:0,
  alive:true,kills:0,deaths:0,respawn:0,
  hp:3,maxHp:3,damage:1,
  atkCd:0,swing:0,swingDir:0,dashCd:0,dashTime:0,dashDir:0,
  _dashLockUntil:0,spawnProt:2.5,walkPhase:0,
  hue:205,char:CHARACTERS.warrior,charId:'warrior',
  name:'',level:1,xp:0,xpNeed:14,
  shieldCharge:1,blockFlash:0,team:'ffa',_auraNext:0
};

let selectedChar=storage.get('oha_char')||'warrior';
if(!CHARACTERS[selectedChar])selectedChar='warrior';
let selectedTeam=storage.get('oha_team')||'ffa';
if(!TEAMS[selectedTeam])selectedTeam='ffa';
let selectedColor=storage.get('oha_color')||'auto';
/* اعتبارسنجی رنگ ذخیره‌شده برای جلوگیری از NaN */
if(selectedColor!=='auto'){
  const parsedC = parseInt(selectedColor,10);
  if(!isFiniteNum(parsedC)||!PALETTE.includes(parsedC))selectedColor='auto';
}
let selectedMode=storage.get('oha_mode')||'online';
if(selectedMode!=='online'&&selectedMode!=='offline')selectedMode='online';

function applyCharUI(charId){
  const k = CHAR_KIT[charId]||CHAR_KIT.warrior;
  document.getElementById('atkIco').innerHTML = k.atk;
  document.getElementById('atkLbl').textContent = k.atkLbl;
  document.getElementById('dashIco').innerHTML = k.dash;
  document.getElementById('dashLbl').textContent = k.dashLbl;
  document.body.dataset.char = charId;
}

function renderCharCards(){
  const box = document.getElementById('chars');
  box.innerHTML = '';
  for(const id of CHAR_LIST){
    const c = CHARACTERS[id];
    const k = CHAR_KIT[id];
    const el = document.createElement('div');
    el.className = 'charCard'+(id===selectedChar?' on':'');
    el.innerHTML = '<div class="charIcon" style="background:hsl('+c.hue+',75%,58%)">'+
      '<svg viewBox="0 0 48 48" fill="rgba(0,0,0,.7)" stroke="rgba(0,0,0,.7)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">'+k.atk+'</svg>'+
      '</div><div class="charName">'+c.name+'</div><div class="charDesc">'+c.desc+'</div>';

let actx=null;
function initAudio(){if(actx)return;try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){actx=null}}
function tone(f1,f2,dur,type,vol){
  if(!actx)return;
  try{
    const t0=actx.currentTime;
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f1,t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t0+dur);
    g.gain.setValueAtTime(vol||0.05,t0);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    o.connect(g);g.connect(actx.destination);
    o.start(t0);o.stop(t0+dur+0.02);
  }catch(e){}
}

function pMaxHpClient(lvl,charId){
  let base = 3 + Math.floor((lvl-1)*0.4);
  if(lvl>=3)base+=1;
  if(lvl>=15)base+=1;
  if(charId==='knight'&&lvl>=10)base+=1;
  return base;
}
function pDamageClient(lvl){
  let d = 1 + Math.floor((lvl-1)/4);
  if(lvl>=8)d+=1;
  if(lvl>=15)d+=1;
  return d;
}
function xpForLevel(lvl){return Math.floor(8+lvl*5+lvl*lvl*1.2)}
function pDashCdClient(charId,level){
  let cd = CFG.dashCd*((CHARACTERS[charId]&&CHARACTERS[charId].dash)||1);
  if(charId==='archer'&&level>=5)cd*=0.82;
  return cd;
}
function pSpeedClient(charId,level){
  let s = CFG.playerSpeed*((CHARACTERS[charId]&&CHARACTERS[charId].speed)||1);
  s*=(1+(level-1)*0.006);
  if(charId==='warrior'&&level>=5)s*=1.08;
  return s;
}
/* ✅ v14.4 — همگام‌سازی دقیق CD حمله با فرمول سرور (شامل ضریب سطح و توانایی) */
function pCdClient(charId, level){
  const L = isFiniteNum(level) ? level : 1;
  let c = CFG.swordCd * ((CHARACTERS[charId] && CHARACTERS[charId].cd) || 1)
        * Math.max(0.70, 1 - (L - 1) * 0.008);
  if(charId === 'warrior' && L >= 10) c *= 0.75;
  return c;
}

/* ═══ برخورد محلی ═══ */
function collideObstaclesClient(ent,radius){
  if(!obstacles.length)return;
  for(let i=0;i<obstacles.length;i++){
    const o=obstacles[i];
    const dx=wrapDelta(ent.x,o.x),dy=wrapDelta(ent.y,o.y);
    const maxR=o.boundR+radius;
    if(dx*dx+dy*dy>maxR*maxR)continue;
    const cos=o.cosr,sin=o.sinr;
    const lx=dx*cos+dy*sin,ly=-dx*sin+dy*cos;
    let bestD2=Infinity,bestCx=0,bestCy=0;
    for(let k=0;k<o.pts.length;k++){
      const a=o.pts[k],b=o.pts[(k+1)%o.pts.length];
      const cp=closestPointOnSegment(lx,ly,a.x,a.y,b.x,b.y);
      if(cp.d2<bestD2){bestD2=cp.d2;bestCx=cp.x;bestCy=cp.y}
    }
    const inside = pointInPolygon(o.pts,lx,ly);
    if(inside){
      let nx=lx-bestCx,ny=ly-bestCy;
      const nl=Math.hypot(nx,ny);
      if(nl<0.0001)continue;
      nx/=nl;ny/=nl;
      const push=radius+nl;
      const wnx=nx*cos-ny*sin,wny=nx*sin+ny*cos;
      ent.x=wrap(ent.x+wnx*push);
      ent.y=wrap(ent.y+wny*push);
    } else if(bestD2<radius*radius){
      let nx=lx-bestCx,ny=ly-bestCy;
      const d=Math.sqrt(bestD2)||0.0001;
      nx/=d;ny/=d;
      const push=radius-d;
      const wnx=nx*cos-ny*sin,wny=nx*sin+ny*cos;
      ent.x=wrap(ent.x+wnx*push);
      ent.y=wrap(ent.y+wny*push);
    }
  }
}
function collidePortalsClient(ent,radius){
  if(!PORTALS.length)return;
  for(let i=0;i<PORTALS.length;i++){
    const p=PORTALS[i];
    const dx=wrapDelta(ent.x,p.x),dy=wrapDelta(ent.y,p.y);
    const pr=(p.radius||38)*0.7;
    const d2=dx*dx+dy*dy;
    const min=pr+radius;
    if(d2<min*min&&d2>0.0001){
      const d=Math.sqrt(d2);
      const push=min-d;
      ent.x=wrap(ent.x+dx/d*push);
      ent.y=wrap(ent.y+dy/d*push);
    }
  }
}

const NET = {
  ws:null, myId:null, connected:false, offline:false, serverTick:0,
  remotePlayers:new Map(), remoteEnemies:new Map(), remoteArrows:new Map(), remoteWaves:new Map(),
  leaderboard:[], lastSnapAt:0, local:null,
  _reconnectInfo:null, _reconnectAttempts:0, _reconnectTimer:null, _heartbeat:null,
  _intentionalClose:false, _lastCloseCode:null, _lastCloseReason:null
};

function setConnBadge(state,text){

      }

function sendToServer(obj){
  if(NET.offline){if(NET.local)NET.local.send(obj);return}
  if(NET.ws&&NET.ws.readyState===1){try{NET.ws.send(JSON.stringify(obj))}catch(e){}}
}
function startHeartbeat(){
  stopHeartbeat();
  NET._heartbeat = setInterval(()=>{
    if(document.hidden)return;
    if(NET.ws&&NET.ws.readyState===1){try{NET.ws.send(JSON.stringify({t:'ping',ts:Date.now()}))}catch(e){}}
  },2000);
}
function stopHeartbeat(){if(NET._heartbeat){clearInterval(NET._heartbeat);NET._heartbeat=null}}
function cancelReconnect(){if(NET._reconnectTimer){clearTimeout(NET._reconnectTimer);NET._reconnectTimer=null}NET._reconnectAttempts=0}
function scheduleReconnect(){
  if(NET._intentionalClose)return;
  if(!NET._reconnectInfo)return;
  if(NET._reconnectTimer)return;
  NET._reconnectAttempts++;
  const delay = Math.min(1000+NET._reconnectAttempts*200,3000);
  setConnBadge('err','قطع — تلاش '+faNum(NET._reconnectAttempts));
  NET._reconnectTimer = setTimeout(()=>{
    NET._reconnectTimer=null;
    if(NET.connected||NET._intentionalClose)return;
    const info = NET._reconnectInfo;
    connectToServer(info.url,info.name,info.charId,info.team,info.color)
      .then(()=>{NET._reconnectAttempts=0})
      .catch(()=>scheduleReconnect());
  },delay);
}

async function connectToServer(url,name,charId,team,color){
  NET._reconnectInfo = {url,name,charId,team,color};
  NET._intentionalClose = false;
  return new Promise((resolve,reject)=>{
    let ws;
    try{ws=new WebSocket(url)}catch(e){return reject(new Error('نشانی سرور نامعتبر است'))}
    let settled=false;
    const timeout = setTimeout(()=>{
      if(settled)return;
      settled=true;
      try{ws.close()}catch(e){}
      reject(new Error('زمان اتصال به پایان رسید'));
    },8000);

    ws.onopen = ()=>{
      setConnBadge('warn','در حال ورود…');
      sendToServer({t:'join',name,charId,team,color});
      startHeartbeat();
    };
    ws.onmessage = (ev)=>{
      let msg;
      try{msg=JSON.parse(ev.data)}catch(e){return}
      if(!msg||typeof msg!=='object')return;

      if(msg.t==='welcome'){
        if(!settled){settled=true;clearTimeout(timeout)}
        NET.myId = msg.id;
        NET.connected = true;
        WSZ = msg.worldSize||WSZ;
        loadWorld(msg);
        if(Array.isArray(msg.chatHistory)){
          for(const c of msg.chatHistory)addChatMessage(c,false);
        }
        setConnBadge('ok','پیوسته');
        resolve();
        return;
      }
      if(msg.t==='error'){
        if(!settled){settled=true;clearTimeout(timeout);reject(new Error(msg.msg||'خطای سرور'))}
        return;
      }
      handleServerMessage(msg);
    };
    ws.onerror = ()=>{if(!settled){settled=true;clearTimeout(timeout);reject(new Error('خطای اتصال شبکه'))}};
    ws.onclose = (ev)=>{
      stopHeartbeat();
      const wasConnected = NET.connected;
      NET.connected = false;
      NET._lastCloseCode = ev.code;
      NET._lastCloseReason = ev.reason||'';
      if(!settled){settled=true;clearTimeout(timeout);reject(new Error('اتصال بسته شد'));return}
      if(NET._intentionalClose)return;
      if(gameActive&&wasConnected)scheduleReconnect();
    };
    NET.ws = ws;
  });
}

function loadWorld(msg){
  NET.remotePlayers.clear();
  NET.remoteEnemies.clear();
  NET.remoteArrows.clear();
  NET.remoteWaves.clear();

  obstacles.length = 0;
  for(const o of msg.obstacles||[]){
    if(!isFiniteNum(o.rot))o.rot = 0;
    if(o.cosr===undefined||!isFiniteNum(o.cosr)){
      o.cosr = Math.cos(o.rot);
      o.sinr = Math.sin(o.rot);
      let boundR=0;
      for(const pt of o.pts){
        const d = Math.hypot(pt.x,pt.y);
        if(d>boundR)boundR=d;
      }
      o.boundR = boundR+2;
    }
    obstacles.push(o);
  }
  PORTALS.length = 0;
  if(Array.isArray(msg.portals))for(const p of msg.portals)PORTALS.push(p);
  genDecors();
  if(isFiniteNum(msg.x))player.x = msg.x;
  if(isFiniteNum(msg.y))player.y = msg.y;
  if(isFiniteNum(msg.hue))player.hue = msg.hue;
  if(typeof msg.team==='string')player.team = msg.team;
  player.correctX=0; player.correctY=0;
  cam.x = player.x; cam.y = player.y;
  inputSeq = 0;
  pendingInputs.length = 0;
}

/* ═══ درون‌یابی ═══ */
let inputSeq = 0;
const pendingInputs = [];
const MAX_PENDING = 60;
function recordInput(ix,iy,aim,dash,atk){
  inputSeq++;
  const inp = {seq:inputSeq,ix,iy,aim,dash,atk};
  pendingInputs.push(inp);
  if(pendingInputs.length>MAX_PENDING)pendingInputs.shift();
  return inp;
}
function ackInputs(ackSeq){while(pendingInputs.length&&pendingInputs[0].seq<=ackSeq)pendingInputs.shift()}

function pushSnapshot(map,id,x,y,a,meta){
  let cur = map.get(id);
  const now = performance.now();
  if(!cur){
    cur = {snapshots:[{t:now,x,y,a}],x,y,angle:a,curr:meta};
    map.set(id,cur);
  } else {
    cur.snapshots.push({t:now,x,y,a});
    while(cur.snapshots.length>CFG.maxSnapshots)cur.snapshots.shift();
    while(cur.snapshots.length>2&&now-cur.snapshots[0].t>1200)cur.snapshots.shift();
    cur.curr = meta;
  }
}
function interpMap(map,now,delayMs){
  const delay = (delayMs!==undefined)?delayMs:CFG.interpDelayMs;
  const targetTime = now - delay;
  for(const [,e] of map){
    const buf = e.snapshots;
    if(!buf||buf.length===0)continue;
    if(buf.length===1){
      if(isFiniteNum(buf[0].x))e.x = buf[0].x;
      if(isFiniteNum(buf[0].y))e.y = buf[0].y;
      if(isFiniteNum(buf[0].a))e.angle = buf[0].a;
      continue;
    }
    let i=0;
    while(i<buf.length-2&&buf[i+1].t<=targetTime)i++;
    const a = buf[i],b = buf[i+1];
    if(!a||!b)continue;
    const span = b.t-a.t;
    const t = span>0?clamp((targetTime-a.t)/span,0,1):0;
    const nx = wrap(a.x+wrapDelta(b.x,a.x)*t);
    const ny = wrap(a.y+wrapDelta(b.y,a.y)*t);
    const na = a.a+angDiff(b.a,a.a)*t;
    if(isFiniteNum(nx))e.x = nx;
    if(isFiniteNum(ny))e.y = ny;
    if(isFiniteNum(na))e.angle = na;
  }
}

function handleServerMessage(msg){
  if(msg.t==='welcome'){
    NET.myId = msg.id; NET.connected = true;
    WSZ = msg.worldSize||WSZ;
    loadWorld(msg);
    if(Array.isArray(msg.chatHistory)){
      for(const c of msg.chatHistory)addChatMessage(c,false);
    }
    return;
  }
  if(msg.t==='state'){
    NET.serverTick = msg.tick;
    NET.lastSnapAt = performance.now();
    if(Array.isArray(msg.lb))NET.leaderboard = msg.lb;
    if(!Array.isArray(msg.p))msg.p=[];
    if(!Array.isArray(msg.e))msg.e=[];
    if(!Array.isArray(msg.ar))msg.ar=[];
    if(!Array.isArray(msg.w))msg.w=[];

    const me = msg.me;
    if(me){
      const aliveChanged = (player.alive!==!!me.al);
      if(aliveChanged||!isFiniteNum(player.x)||!isFiniteNum(player.y)){
        if(isFiniteNum(me.x))player.x = me.x;
        if(isFiniteNum(me.y))player.y = me.y;
        player.vx=0; player.vy=0; player.dashTime=0;
        player.correctX=0; player.correctY=0;
        cam.x=player.x; cam.y=player.y;
        pendingInputs.length=0;
        if(isFiniteNum(me.ack)) inputSeq = Math.max(inputSeq, me.ack);
      } else if(player.alive){
        const errX = wrapDelta(me.x,player.x);
        const errY = wrapDelta(me.y,player.y);
        const errMag = Math.hypot(errX,errY);
        if(errMag>400){
          if(isFiniteNum(me.x))player.x = me.x;
          if(isFiniteNum(me.y))player.y = me.y;
          player.vx=0; player.vy=0;
          player.correctX=0; player.correctY=0;
          cam.x=player.x; cam.y=player.y;
        } else {
          player.correctX = errX;
          player.correctY = errY;
        }
        if(isFiniteNum(me.ack))ackInputs(me.ack);
      }
      if(isFiniteNum(me.dc)){
        if(Math.abs(me.dc-player.dashCd)>0.2||me.dc>player.dashCd){
          player.dashCd = me.dc;
          const serverCdMs = me.dc*1000;
          const localRemain = _dashCooldownLocal - performance.now();
          if(localRemain<serverCdMs)_dashCooldownLocal = performance.now()+serverCdMs;
        }
      } else {
        if(!isFiniteNum(player.dashCd))player.dashCd=0;
      }
      if(isFiniteNum(me.ac)){
        if(me.ac>0 && player.atkCd < me.ac-0.05){
          player.atkCd = me.ac;
        } else if(me.ac<=0 && player.atkCd>0.05 && pendingInputs.length===0){
          player.atkCd = Math.min(player.atkCd,0.02);
        }
      } else {
        if(!isFiniteNum(player.atkCd))player.atkCd=0;
      }
      player.alive = !!me.al;
      if(isFiniteNum(me.k))player.kills = me.k;
      if(isFiniteNum(me.d))player.deaths = me.d;
      if(isFiniteNum(me.lv))player.level = me.lv;
      if(isFiniteNum(me.xp))player.xp = me.xp;
      if(isFiniteNum(me.xn))player.xpNeed = me.xn;
      if(isFiniteNum(me.mhp)&&me.mhp>0)player.maxHp = me.mhp;
      else player.maxHp = pMaxHpClient(player.level,player.charId);
      if(isFiniteNum(me.hp))player.hp = clamp(me.hp,0,player.maxHp);
      else player.hp = player.maxHp;
      if(isFiniteNum(me.dmg))player.damage = me.dmg;
      else player.damage = pDamageClient(player.level);
      if(isFiniteNum(me.sp))player.spawnProt = me.sp;
      else player.spawnProt = 0;
      if(isFiniteNum(me.sc))player.shieldCharge = me.sc;
      else if(CHARACTERS[player.charId]&&CHARACTERS[player.charId].shield)player.shieldCharge = 0;
      if(isFiniteNum(me.bf))player.blockFlash = me.bf;
      else player.blockFlash = 0;
      if(isFiniteNum(me.rs))player.respawn = me.rs;
      else player.respawn = 0;
    }

    const seenP = new Set();
    for(const p of msg.p){
      if(p.id===NET.myId)continue;
      if(!isFiniteNum(p.x)||!isFiniteNum(p.y))continue;
      seenP.add(p.id);
      pushSnapshot(NET.remotePlayers,p.id,p.x,p.y,p.a||0,p);
    }
    for(const id of [...NET.remotePlayers.keys()])if(!seenP.has(id))NET.remotePlayers.delete(id);

    const seenE = new Set();
    for(const e of msg.e){
      if(!isFiniteNum(e.x)||!isFiniteNum(e.y))continue;
      seenE.add(e.id);
      pushSnapshot(NET.remoteEnemies,e.id,e.x,e.y,e.a||0,e);
    }
    for(const id of [...NET.remoteEnemies.keys()])if(!seenE.has(id))NET.remoteEnemies.delete(id);

    const seenA = new Set();
    for(const a of msg.ar){
      if(!isFiniteNum(a.x)||!isFiniteNum(a.y))continue;
      seenA.add(a.id);
      pushSnapshot(NET.remoteArrows,a.id,a.x,a.y,a.a||0,a);
    }
    for(const id of [...NET.remoteArrows.keys()])if(!seenA.has(id))NET.remoteArrows.delete(id);

    const seenW = new Set();
    for(const w of msg.w){
      if(!isFiniteNum(w.x)||!isFiniteNum(w.y))continue;
      seenW.add(w.id);
      pushSnapshot(NET.remoteWaves,w.id,w.x,w.y,w.a||0,w);
    }
    for(const id of [...NET.remoteWaves.keys()])if(!seenW.has(id))NET.remoteWaves.delete(id);

    updateHUD();
    const hEnemies = document.getElementById('hEnemies');
    if(hEnemies)hEnemies.textContent = faNum(NET.remoteEnemies.size);
    return;
  }
  if(msg.t==='ev'){
    const evList = Array.isArray(msg.ev)?msg.ev:[];
    for(const ev of evList){
      if(ev.t==='burst'){
        burst(ev.x,ev.y,ev.h,ev.big?40:22);
        if(ev.big)shake = Math.max(shake,6);
      } else if(ev.t==='levelup'){
        rings.push({x:ev.x,y:ev.y,r:0,maxR:190,life:0.85,maxLife:0.85,hue:ev.h});
        if(ev.id===NET.myId){
          screenFlash = 0.35;
          SFX.level();
          showToast('سطح '+faNum(ev.newLevel||player.level));
        }
      } else if(ev.t==='ability'){
        if(ev.id===NET.myId){
          const abilities = {
            warrior:{1:'ضربه سرعتی',2:'گردابی',3:'موج شمشیر',4:'افکت دود'},
            knight:{1:'قدرت بیشتر',2:'ضربه کوبنده',3:'زره ابدی',4:'افکت یخ'},
            archer:{1:'سرعت جهش',2:'سه‌گانه',3:'تیر نافذ',4:'افکت برق'},
            tank:{1:'افزایش سلامت',2:'بازتاب سپر',3:'قلعه متحرک',4:'افکت یخ'}
          };
          const txt = (abilities[ev.charId]||{})[ev.tier]||'توانایی تازه';
          SFX.level();
          showToast('توانایی تازه: '+txt);
          rings.push({x:player.x,y:player.y,r:0,maxR:280,life:1.2,maxLife:1.2,hue:player.hue});
        }
        if(ev.newLevel>=AURA_LEVEL){
          const type = AURA_TYPE[ev.charId]||'smoke';
          try{
            if(type==='lightning')FX.addLightning(ev.x,ev.y,1.2);
            else if(type==='ice')FX.addIce(ev.x,ev.y,1.2);
            else FX.addSmoke(ev.x,ev.y,1.4);
          }catch(e){}
          if(ev.id===NET.myId){screenFlash=0.6;shake=Math.max(shake,10)}
        }
      } else if(ev.t==='block'){
        rings.push({x:ev.x,y:ev.y,r:20,maxR:150,life:0.55,maxLife:0.55,hue:ev.h});
        if(ev.id===NET.myId)SFX.block();
      } else if(ev.t==='hurt'){
        rings.push({x:ev.x,y:ev.y,r:16,maxR:100,life:0.4,maxLife:0.4,hue:0});
        if(ev.id===NET.myId){SFX.block();vibrate(30);shake=Math.max(shake,6)}
      } else if(ev.t==='hit'){
        if(window.FX)try{FX.addSmoke(ev.x,ev.y,0.4)}catch(e){}
        for(let i=0;i<4;i++)addParticle(ev.x,ev.y,ev.h||200,0.3,0.6,2);
      } else if(ev.t==='death'){
        if(ev.id===NET.myId){
          SFX.die();
          player.level=1; player.xp=0; player.xpNeed=xpForLevel(1);
          player.maxHp = pMaxHpClient(1,player.charId);
          player.hp = player.maxHp;
          player.damage = pDamageClient(1);
          player.dashTime=0; player.dashCd=0; player.atkCd=0; player.swing=0;
          player._auraNext=0; player.correctX=0; player.correctY=0;
          showToast('تمام سطح و ویژگی‌هایت از دست رفت');
          updateHUD();
        }
      } else if(ev.t==='kill'){
        if(ev.killerId===NET.myId){
          SFX.kill();
          showToast('کشتی: '+escapeHtml(ev.victimName||'')+(ev.levelUp?' — ارتقا':''));
        }
      } else if(ev.t==='join'){
        if(ev.name!==player.name){SFX.join();showToast(escapeHtml(ev.name||'')+' وارد شد')}
      } else if(ev.t==='leave'){
        showToast(escapeHtml(ev.name||'')+' خارج شد');
      }
    }
    return;
  }
  if(msg.t==='chat'){addChatMessage(msg,true)}
}

/* ═══ aura ═══ */
function tickAuras(dt,now){
  if(!window.FX)return;
  if(player.alive&&player.level>=AURA_LEVEL){
    if(!player._auraNext)player._auraNext = now;
    if(now>=player._auraNext){
      const type = AURA_TYPE[player.charId]||'smoke';
      FX.addAura(player.x,player.y,type,player.hue,1.0);
      player._auraNext = now+(AURA_INTERVAL[player.charId]||280);
    }
  } else player._auraNext = 0;
  for(const [,rp] of NET.remotePlayers){
    const c = rp.curr;
    if(!c||!c.al||!c.lv||c.lv<AURA_LEVEL){rp._auraNext=0;continue}
    if(!rp._auraNext)rp._auraNext = now;
    if(now>=rp._auraNext){
      const type = AURA_TYPE[c.c]||'smoke';
      FX.addAura(rp.x,rp.y,type,c.h||205,0.75);
      rp._auraNext = now+(AURA_INTERVAL[c.c]||300);
    }
  }
}

/* ═══ سرور محلی ═══ */
function createLocalServer(name,charId,team,color){
  const ch = CHARACTERS[charId]||CHARACTERS.warrior;
  const L = {
    WSZ, obstacles:[], portals:[], enemies:[], arrows:[], waves:[], events:[],
    nextEnemyId:1, nextArrowId:1, nextWaveId:1, tick:0, spawnTimer:0, onMessage:null,
    interval:null, netInterval:null,
    lastAckSeq:0,
    player:{
      id:1, name, charId:ch.id, team,
      hue: color!=='auto'?parseInt(color,10):(team!=='ffa'?TEAMS[team].hue:ch.hue),
      x:1900,y:1900,vx:0,vy:0,angle:0,
      alive:true,kills:0,deaths:0,hp:3,
      level:1,xp:0,xpNeed:xpForLevel(1),
      atkCd:0,swing:0,swingDir:0,dashCd:0,dashTime:0,dashDir:0,
      spawnProt:CFG.initialProt,respawn:0,walkPhase:0,
      shieldCharge:ch.shield?1:0,blockFlash:0,
      inX:0,inY:0,aim:0,aimSet:false,
      wantAttack:false,wantAttackHeld:false,wantDash:false,
      _pendingAtk:false
    },
    send(msg){
      if(msg.t==='in'){
        const p = this.player;
        p.inX = clamp(+msg.mx||0,-1,1);
        p.inY = clamp(+msg.my||0,-1,1);
        if(isFiniteNum(msg.aim)){p.aim = msg.aim; p.aimSet = true}
        if(msg.dash)p.wantDash = true;
        if(msg.atk)p.wantAttack = true;
        p.wantAttackHeld = !!msg.atkHeld;
        if(isFiniteNum(msg.seq))L.lastAckSeq = msg.seq;
      } else if(msg.t==='chat'){
        this.onMessage({t:'chat',from:this.player.name,fromId:this.player.id,team:this.player.team,hue:this.player.hue,text:msg.text});
      }
    },
    start(){this.interval=setInterval(()=>this.tickOnce(),33);this.netInterval=setInterval(()=>this.emitState(),100)},
    stop(){clearInterval(this.interval);clearInterval(this.netInterval)}
  };

  let seed = 20240930;
  const rnd = ()=>{seed=(seed*1664525+1013904223)&0xffffffff;return((seed>>>0)/4294967296)};
  const rr = (a,b)=>a+rnd()*(b-a);
  const ri = (a,b)=>Math.floor(rr(a,b+1));
  const pickMonster = ()=>MT_LIST[Math.floor(rnd()*MT_LIST.length)];

  let placed = 0;
  for(let tries=0;tries<80*30&&placed<80;tries++){
    const x = rr(120,WSZ-120),y = rr(120,WSZ-120);
    if(Math.hypot(x-WSZ/2,y-WSZ/2)<460)continue;
    const rad = rr(24,62);
    let overlap = false;
    for(const o of L.obstacles){
      const ddx = Math.abs(x-o.x),wdx = Math.min(ddx,WSZ-ddx);
      const ddy = Math.abs(y-o.y),wdy = Math.min(ddy,WSZ-ddy);
      if(Math.hypot(wdx,wdy)<o.r+rad+20){overlap=true;break}
    }
    if(overlap)continue;
    const n = ri(5,8),pts=[];
    let boundR = 0;
    for(let j=0;j<n;j++){
      const a = j/n*TAU,rrr = rad*rr(0.78,1.18);
      const px = Math.cos(a)*rrr,py = Math.sin(a)*rrr;
      pts.push({x:px,y:py});
      if(Math.hypot(px,py)>boundR)boundR = Math.hypot(px,py);
    }
    const rot = rr(0,TAU);
    L.obstacles.push({x,y,r:rad,boundR:boundR+2,pts,rot,cosr:Math.cos(rot),sinr:Math.sin(rot)});
    placed++;
  }
  const cx = WSZ/2,cy = WSZ/2,baseR = WSZ*0.33;
  for(let i=0;i<16;i++){
    let placed2 = false;
    for(let tries=0;tries<60&&!placed2;tries++){
      const angle = (i/16)*TAU+rr(-0.2,0.2);
      const r2_ = baseR+rr(-260,260);
      const x = wrap(cx+Math.cos(angle)*r2_);
      const y = wrap(cy+Math.sin(angle)*r2_);
      let ok = true;
      for(const o of L.obstacles){
        const dx = Math.abs(x-o.x),wdx = Math.min(dx,WSZ-dx);
        const dy = Math.abs(y-o.y),wdy = Math.min(dy,WSZ-dy);
        if(Math.hypot(wdx,wdy)<o.boundR+70){ok=false;break}
      }
      if(!ok)continue;
      let tooClose = false;
      for(const p of L.portals){
        const dx = Math.abs(x-p.x),wdx = Math.min(dx,WSZ-dx);
        const dy = Math.abs(y-p.y),wdy = Math.min(dy,WSZ-dy);
        if(Math.hypot(wdx,wdy)<320){tooClose=true;break}
      }
      if(tooClose)continue;
      L.portals.push({id:i,x,y,hue:Math.round(rr(0,360)),radius:38,cooldown:rr(0,0.6)});
      placed2 = true;
    }
  }

  function wrapLocal(v){v%=WSZ;if(v<0)v+=WSZ;return v}
  function wrapDeltaLocal(a,b){let d=(a-b)%WSZ;if(d>WSZ/2)d-=WSZ;if(d<-WSZ/2)d+=WSZ;return d}
  function wrapDistLocal(ax,ay,bx,by){return Math.hypot(wrapDeltaLocal(ax,bx),wrapDeltaLocal(ay,by))}

  function collideLocal(ent,radius){
    for(const o of L.obstacles){
      const dx = wrapDeltaLocal(ent.x,o.x),dy = wrapDeltaLocal(ent.y,o.y);
      const maxR = o.boundR+radius;
      if(dx*dx+dy*dy>maxR*maxR)continue;
      const cos = o.cosr,sin = o.sinr;
      const lx = dx*cos+dy*sin,ly = -dx*sin+dy*cos;
      let bestD2 = Infinity,bestCx = 0,bestCy = 0;
      for(let k=0;k<o.pts.length;k++){
        const A = o.pts[k],B = o.pts[(k+1)%o.pts.length];
        const cp = closestPointOnSegment(lx,ly,A.x,A.y,B.x,B.y);
        if(cp.d2<bestD2){bestD2 = cp.d2;bestCx = cp.x;bestCy = cp.y}
      }
      const inside = pointInPolygon(o.pts,lx,ly);
      if(inside){
        let nx = lx-bestCx,ny = ly-bestCy;
        const nl = Math.hypot(nx,ny);
        if(nl<0.0001)continue;
        nx/=nl;ny/=nl;
        const push = radius+nl;
        const wnx = nx*cos-ny*sin,wny = nx*sin+ny*cos;
        ent.x = wrapLocal(ent.x+wnx*push);
        ent.y = wrapLocal(ent.y+wny*push);
      } else if(bestD2<radius*radius){
        let nx = lx-bestCx,ny = ly-bestCy;
        const d = Math.sqrt(bestD2)||0.0001;
        nx/=d;ny/=d;
        const push = radius-d;
        const wnx = nx*cos-ny*sin,wny = nx*sin+ny*cos;
        ent.x = wrapLocal(ent.x+wnx*push);
        ent.y = wrapLocal(ent.y+wny*push);
      }
    }
  }
  function collidePortalsLocal(ent,radius){
    for(const pt of L.portals){
      const dx = wrapDeltaLocal(ent.x,pt.x),dy = wrapDeltaLocal(ent.y,pt.y);
      const pr = (pt.radius||38)*0.7;
      const d2 = dx*dx+dy*dy;
      const min = pr+radius;
      if(d2<min*min&&d2>0.0001){
        const d = Math.sqrt(d2);
        ent.x = wrapLocal(ent.x+dx/d*(min-d));
        ent.y = wrapLocal(ent.y+dy/d*(min-d));
      }
    }
  }

  function spawnEnemyFromPortal(portal){
    const t = pickMonster();
    const a = rr(0,TAU);
    const dist = (portal.radius||38)+rr(4,26);
    const targetX = wrapLocal(portal.x+Math.cos(a)*dist);
    const targetY = wrapLocal(portal.y+Math.sin(a)*dist);
    L.enemies.push({
      id:L.nextEnemyId++,typeId:t.id,
      x:portal.x,y:portal.y,px0:portal.x,py0:portal.y,targetX,targetY,emergeT:0,
      vx:0,vy:0,angle:rr(0,TAU),alive:true,dead:false,
      spawnAnim:CFG.emergeDuration,portalId:portal.id,
      walkPhase:rr(0,TAU),wobblePhase:rr(0,TAU),wanderPhase:rr(0,TAU),
      dashCd:rr(1.5,3),dashTime:0,dashDir:0,teleCd:rr(5,9),
      retargetCd:0,targetId:null,
      hue:t.hue+rr(-14,14),hp:t.hp||1,
      outX:Math.cos(a),outY:Math.sin(a),
      knockVX:0,knockVY:0,knockTime:0
    });
  }

  function killEnemyLocal(e,by){
    if(e.dead)return;
    e.dead = true; e.alive = false;
    const i = L.enemies.indexOf(e);
    if(i>=0)L.enemies.splice(i,1);
    L.events.push({t:'burst',x:e.x,y:e.y,h:Math.round(e.hue)});
    if(by){
      by.kills++;
      by.xp += (MONSTER_TYPES[e.typeId].xp||1);
      while(by.xp>=by.xpNeed){
        by.xp -= by.xpNeed;
        by.level++;
        by.xpNeed = xpForLevel(by.level);
        L.events.push({t:'levelup',x:by.x,y:by.y,h:by.hue,id:by.id,newLevel:by.level});
        const thresholds = [3,5,8,10,15];
        if(thresholds.includes(by.level)){
          L.events.push({t:'ability',x:by.x,y:by.y,h:by.hue,id:by.id,
            tier:by.level>=15?4:by.level>=10?3:by.level>=5?2:1,charId:by.charId,newLevel:by.level});
        }
      }
    }
  }
  function hitEnemyLocal(e,by,dmg,kx,ky,kt){
    if(e.dead)return;
    e.hp = (e.hp||1)-dmg;
    if(kx!==undefined){e.knockVX = kx;e.knockVY = ky;e.knockTime = kt||0.35}
    if(e.hp<=0)killEnemyLocal(e,by);
    else L.events.push({t:'hit',x:e.x,y:e.y,h:Math.round(e.hue)});
  }
  function killPlayerLocal(p,enemy){
    if(!p.alive||p.spawnProt>0)return;
    if(CHARACTERS[p.charId].shield&&p.shieldCharge>=1){
      p.shieldCharge = 0; p.spawnProt = 1.2; p.blockFlash = 1;
      L.events.push({t:'block',x:p.x,y:p.y,h:p.hue,id:p.id});
      return;
    }
    let dmg = 1;
    if(enemy&&MONSTER_TYPES[enemy.typeId])dmg = MONSTER_TYPES[enemy.typeId].dmg||1;
    p.hp = (p.hp||3)-dmg;
    if(p.hp>0){
      p.spawnProt = 0.8; p.blockFlash = 1;
      L.events.push({t:'hurt',x:p.x,y:p.y,h:p.hue,id:p.id,hp:p.hp});
      return;
    }
    p.alive = false; p.deaths++; p.respawn = CFG.respawnTime;
    p.vx = 0; p.vy = 0; p.swing = 0; p.atkCd = 0;
    p.dashTime = 0; p.wantAttack = false; p.wantDash = false;
    p.level = 1; p.xp = 0; p.xpNeed = xpForLevel(1);
    p.aimSet = false; p.inX = 0; p.inY = 0;
    p._pendingAtk = false;
    L.events.push({t:'burst',x:p.x,y:p.y,h:p.hue,big:true});
    L.events.push({t:'death',x:p.x,y:p.y,id:p.id,by:'monster'});
  }

  function respawnLocal(p){
    p.level = 1; p.xp = 0; p.xpNeed = xpForLevel(1);
    p.hp = pMaxHpClient(1,p.charId);
    p.damage = pDamageClient(1);
    p.x = rr(WSZ*0.4,WSZ*0.6);
    p.y = rr(WSZ*0.4,WSZ*0.6);
    p.vx = 0; p.vy = 0;
    p.alive = true;
    p.spawnProt = CFG.respawnProt;
    p.dashTime = 0; p.dashCd = 0; p.atkCd = 0.4; p.swing = 0;
    p.shieldCharge = CHARACTERS[p.charId].shield?1:0;
    p.blockFlash = 0;
    p.aimSet = false; p.inX = 0; p.inY = 0;
    p.respawn = 0;
    p.dashDir = 0; p.swingDir = 0;
    p._pendingAtk = false;
  }

  L.tickOnce = function(){
    try{
      const dt = 33/1000;
      L.tick++;
      const p = L.player;
      if(!p.alive){
        p.respawn -= dt;
        if(p.respawn<=0)respawnLocal(p);
      } else {
        if(!isFiniteNum(p.x)||!isFiniteNum(p.y))respawnLocal(p);
        p.atkCd = Math.max(-1,p.atkCd-dt);
        p.swing = Math.max(-1,p.swing-dt);
        p.dashCd = Math.max(-1,p.dashCd-dt);
        p.spawnProt = Math.max(-1,p.spawnProt-dt);
        p.blockFlash = Math.max(0,p.blockFlash-dt*1.8);
        if(CHARACTERS[p.charId].shield&&p.shieldCharge<1)p.shieldCharge = Math.min(1,p.shieldCharge+dt/8);
        const moving = Math.hypot(p.inX,p.inY)>0.02;
        let ta = p.angle;
        if(p.aimSet&&isFiniteNum(p.aim))ta = p.aim;
        else if(moving)ta = Math.atan2(p.inY,p.inX);
        p.angle = normAng(p.angle+angDiff(ta,p.angle)*Math.min(1,dt*15));
        if(!isFiniteNum(p.angle))p.angle = 0;
        if(p.wantDash){
          p.wantDash = false;
          if(p.dashTime<=0&&p.dashCd<=0){
            p.dashCd = pDashCdClient(p.charId,p.level);
            p.dashTime = CFG.dashDur;
            p.dashDir = moving?Math.atan2(p.inY,p.inX):p.angle;
          }
        }
        const spd = pSpeedClient(p.charId,p.level);
        if(p.dashTime>0){
          p.dashTime -= dt;
          const moveD = CFG.dashSpeed*(CHARACTERS[p.charId].dash||1)*dt;
          const steps = Math.max(1,Math.ceil(moveD/18));
          for(let s=0;s<steps;s++){
            p.x = wrapLocal(p.x+Math.cos(p.dashDir)*moveD/steps);
            p.y = wrapLocal(p.y+Math.sin(p.dashDir)*moveD/steps);
            collideLocal(p,16); collidePortalsLocal(p,16);
          }
          p.walkPhase += dt*20;
        } else {
          const k = 1-Math.pow(0.0000018,dt);
          p.vx = lerp(p.vx,p.inX*spd,k);
          p.vy = lerp(p.vy,p.inY*spd,k);
          const vx = p.vx*dt,vy = p.vy*dt;
          const mlen = Math.hypot(vx,vy);
          const steps = Math.max(1,Math.ceil(mlen/18));
          for(let s=0;s<steps;s++){
            p.x = wrapLocal(p.x+vx/steps);
            p.y = wrapLocal(p.y+vy/steps);
            collideLocal(p,16); collidePortalsLocal(p,16);
          }
          p.walkPhase += moving?dt*11:dt*2.5;
        }
        if(!isFiniteNum(p.x)||!isFiniteNum(p.y)){p.x = WSZ/2; p.y = WSZ/2; p.vx = 0; p.vy = 0}
        /* ✅ v14.4 — صف حمله + CD همگام‌شده با سرور */
        if(p.wantAttack)p._pendingAtk = true;
        if((p._pendingAtk||p.wantAttackHeld) && p.atkCd<=0){
          p._pendingAtk = false;
          p.atkCd = pCdClient(p.charId, p.level);
          p.swing = 0.16;
          p.swingDir = p.angle;
          const char = CHARACTERS[p.charId];
          if(char.id==='archer'){
            const shots = p.level>=5?[-0.13,0,0.13]:[0];
            for(const off of shots){
              const aa = p.angle+off;
              L.arrows.push({
                id:L.nextArrowId++,ownerId:p.id,
                x:wrapLocal(p.x+Math.cos(aa)*22),y:wrapLocal(p.y+Math.sin(aa)*22),
                px:wrapLocal(p.x+Math.cos(aa)*22),py:wrapLocal(p.y+Math.sin(aa)*22),
                vx:Math.cos(aa)*CFG.arrowSpeed,vy:Math.sin(aa)*CFG.arrowSpeed,
                angle:aa,life:2.0,hue:p.hue
              });
            }
          } else {
            /* ✅ v14.4 — موج شمشیر سطح ۱۰ برای شمشیرزن در آفلاین */
            if(char.id==='warrior' && p.level>=10){
              L.waves.push({
                id:L.nextWaveId++, ownerId:p.id, team:p.team,
                x:p.x, y:p.y, angle:p.angle,
                speed:CFG.waveSpeed, life:CFG.waveLife, maxLife:CFG.waveLife,
                dmg:pDamageClient(p.level), hue:p.hue
              });
            }
            const range = CFG.swordRange*(char.range||1);
            const arc = (p.charId==='warrior'&&p.level>=5)?Math.PI:CFG.swordArc;
            for(let i=L.enemies.length-1;i>=0;i--){
              const e = L.enemies[i];
              if(e.spawnAnim>0.5||e.dead)continue;
              const t = MONSTER_TYPES[e.typeId];
              const d = wrapDistLocal(e.x,e.y,p.x,p.y);
              if(d<range+t.radius*0.5){
                const a = Math.atan2(wrapDeltaLocal(e.y,p.y),wrapDeltaLocal(e.x,p.x));
                const angSize = t.radius/Math.max(d,1);
                if(Math.abs(angDiff(a,p.angle))<arc+angSize){
                  if(p.charId==='knight'&&p.level>=5)
                    hitEnemyLocal(e,p,pDamageClient(p.level),Math.cos(a)*420,Math.sin(a)*420,0.4);
                  else hitEnemyLocal(e,p,pDamageClient(p.level));
                }
              }
            }
          }
        }
        p.wantAttack = false;
      }
      for(let i=L.enemies.length-1;i>=0;i--){
        const e = L.enemies[i];
        const t = MONSTER_TYPES[e.typeId];
        if(!t||e.dead){L.enemies.splice(i,1);continue}
        if(!isFiniteNum(e.x)||!isFiniteNum(e.y)){e.dead = true;L.enemies.splice(i,1);continue}
        if(e.spawnAnim>0){
          const prev = e.spawnAnim;
          const total = CFG.emergeDuration;
          e.spawnAnim = Math.max(0,e.spawnAnim-dt);
          const progress = clamp(1-e.spawnAnim/total,0,1);
          e.emergeT = progress;
          const ease = 1-Math.pow(1-progress,3);
          e.x = wrapLocal((e.px0||e.x)+wrapDeltaLocal(e.targetX||e.x,e.px0||e.x)*ease);
          e.y = wrapLocal((e.py0||e.y)+wrapDeltaLocal(e.targetY||e.y,e.py0||e.y)*ease);
          if(prev>0&&e.spawnAnim===0){
            const outAngle = Math.atan2(e.outY||0,e.outX||0)+rr(-0.5,0.5);
            e.vx = Math.cos(outAngle)*t.speed*1.8;
            e.vy = Math.sin(outAngle)*t.speed*1.8;
          }
          continue;
        }
        if(e.knockTime>0){
          e.knockTime -= dt;
          e.x = wrapLocal(e.x+e.knockVX*dt);
          e.y = wrapLocal(e.y+e.knockVY*dt);
          const k = Math.exp(-4*dt);
          e.knockVX *= k; e.knockVY *= k;
          continue;
        }
        e.dashCd = Math.max(0,e.dashCd-dt);
        e.teleCd = Math.max(0,e.teleCd-dt);
        e.wanderPhase += dt*2.5;
        e.retargetCd -= dt;
        let target = (p.alive)?p:null;
        if(!target||e.retargetCd<=0)e.retargetCd = rr(2.0,4.0);
        if(!target){
          const w = t.speed*0.75;
          const wx = Math.cos(e.wanderPhase*1.5)*w;
          const wy = Math.sin(e.wanderPhase*1.1)*w;
          e.vx = lerp(e.vx,wx,0.10);
          e.vy = lerp(e.vy,wy,0.10);
          e.x = wrapLocal(e.x+e.vx*dt);
          e.y = wrapLocal(e.y+e.vy*dt);
          if(e.typeId!=='ghost')collideLocal(e,t.radius*0.9);
          e.walkPhase += dt*8;
          continue;
        }
        const dxT = wrapDeltaLocal(target.x,e.x),dyT = wrapDeltaLocal(target.y,e.y);
        const dvT = Math.hypot(dxT,dyT)||0.001;
        const dirTX = dxT/dvT,dirTY = dyT/dvT;
        let desireX = dirTX,desireY = dirTY;
        if(e.typeId==='demon'){
          if(e.dashTime<=0&&e.dashCd<=0&&dvT<380&&dvT>140){
            if(rnd()<dt*0.55){
              e.dashTime = 0.24;
              e.dashDir = Math.atan2(dyT,dxT);
              e.dashCd = rr(2.5,4.0);
            }
          }
        } else if(e.typeId==='ghost'){
          if(dvT<280){
            const s = Math.sin(L.tick*0.08+e.wobblePhase);
            desireX = dirTX+(-dirTY)*s*0.75;
            desireY = dirTY+(dirTX)*s*0.75;
          }
        } else if(e.typeId==='wraith'){
          if(e.teleCd<=0&&dvT>320&&dvT<800){
            e.teleCd = rr(5,9);
            const side = rnd()<0.5?-1:1;
            const behind = Math.atan2(dyT,dxT)+side*(Math.PI/2+rr(-0.3,0.3));
            const rr2 = rr(120,180);
            e.x = wrapLocal(target.x+Math.cos(behind)*rr2);
            e.y = wrapLocal(target.y+Math.sin(behind)*rr2);
            e.vx = 0; e.vy = 0;
          }
        } else if(e.typeId==='golem'){
          if(dvT<180){desireX *= 0.75; desireY *= 0.75}
        }
        let sepX = 0,sepY = 0;
        for(const other of L.enemies){
          if(other===e||other.spawnAnim>0.5||other.dead)continue;
          const ot = MONSTER_TYPES[other.typeId];
          if(!ot)continue;
          const dx = wrapDeltaLocal(e.x,other.x),dy = wrapDeltaLocal(e.y,other.y);
          const d = Math.hypot(dx,dy)||0.001;
          const minD = t.radius+ot.radius+20;
          if(d<minD*1.8){
            const w = (minD*1.8-d)/(minD*1.8);
            sepX += (dx/d)*w*2.2;
            sepY += (dy/d)*w*2.2;
          }
        }
        let avoidX = 0,avoidY = 0;
        const lookAhead = 55;
        const fx = e.x+desireX*lookAhead,fy = e.y+desireY*lookAhead;
        for(const o of L.obstacles){
          const dx = wrapDeltaLocal(o.x,fx),dy = wrapDeltaLocal(o.y,fy);
          const distSq = dx*dx+dy*dy;
          const bound = o.boundR+t.radius+8;
          if(distSq<bound*bound){
            const odx = wrapDeltaLocal(e.x,o.x),ody = wrapDeltaLocal(e.y,o.y);
            const od = Math.hypot(odx,ody)||1;
            let perpX = -ody/od,perpY = odx/od;
            const dot = perpX*desireX+perpY*desireY;
            if(dot<0){perpX = -perpX;perpY = -perpY}
            const w = (bound-Math.sqrt(distSq))/bound;
            avoidX += perpX*w*2.2;
            avoidY += perpY*w*2.2;
          }
        }
        let moveX = desireX+sepX+avoidX;
        let moveY = desireY+sepY+avoidY;
        const mm = Math.hypot(moveX,moveY)||1;
        moveX /= mm; moveY /= mm;
        let speed = t.speed;
        if(e.dashTime>0){
          e.dashTime -= dt;
          speed = t.speed*3.0;
          moveX = Math.cos(e.dashDir);
          moveY = Math.sin(e.dashDir);
        }
        const k = 1-Math.pow(0.000003,dt);
        e.vx = lerp(e.vx,moveX*speed,k);
        e.vy = lerp(e.vy,moveY*speed,k);
        e.x = wrapLocal(e.x+e.vx*dt);
        e.y = wrapLocal(e.y+e.vy*dt);
        const ta2 = Math.atan2(dyT,dxT);
        e.angle = normAng(e.angle+angDiff(ta2,e.angle)*Math.min(1,dt*10));
        if(!isFiniteNum(e.angle))e.angle = 0;
        if(e.typeId!=='ghost')collideLocal(e,t.radius*0.9);
        e.walkPhase += dt*8;
        e.wobblePhase += dt*3;
        if(p.spawnProt<=0&&p.alive&&wrapDistLocal(e.x,e.y,p.x,p.y)<t.radius+15){
          killPlayerLocal(p,e);
        }
      }
      for(let i=L.arrows.length-1;i>=0;i--){
        const a = L.arrows[i];
        a.px = a.x; a.py = a.y;
        a.x = wrapLocal(a.x+a.vx*dt);
        a.y = wrapLocal(a.y+a.vy*dt);
        a.life -= dt;
        let hit = false;
        const totalD = Math.hypot(wrapDeltaLocal(a.x,a.px),wrapDeltaLocal(a.y,a.py));
        const steps = Math.max(1,Math.ceil(totalD/12));
        for(let s=1;s<=steps&&!hit;s++){
          const tt = s/steps;
          const sx = wrapLocal(a.px+wrapDeltaLocal(a.x,a.px)*tt);
          const sy = wrapLocal(a.py+wrapDeltaLocal(a.y,a.py)*tt);
          for(let j=L.enemies.length-1;j>=0;j--){
            const e = L.enemies[j];
            const ty = MONSTER_TYPES[e.typeId];
            if(e.spawnAnim>0.5||e.dead)continue;
            if(wrapDistLocal(e.x,e.y,sx,sy)<ty.radius+6){
              hitEnemyLocal(e,L.player,pDamageClient(L.player.level));
              hit = true; break;
            }
          }
        }
        if(hit||a.life<=0)L.arrows.splice(i,1);
      }
      for(let i=L.waves.length-1;i>=0;i--){
        const w = L.waves[i];
        const dtMove = w.speed*dt;
        w.x = wrapLocal(w.x+Math.cos(w.angle)*dtMove);
        w.y = wrapLocal(w.y+Math.sin(w.angle)*dtMove);
        w.life -= dt;
        if(w.life<=0){L.waves.splice(i,1);continue}
        for(let j=L.enemies.length-1;j>=0;j--){
          const e = L.enemies[j];
          if(e.dead)continue;
          const ty = MONSTER_TYPES[e.typeId];
          if(!ty)continue;
          const d = wrapDistLocal(e.x,e.y,w.x,w.y);
          if(d<ty.radius+22)hitEnemyLocal(e,L.player,w.dmg);
        }
      }
      for(const pt of L.portals)pt.cooldown = Math.max(0,pt.cooldown-dt);
      L.spawnTimer -= dt;
      if(L.spawnTimer<=0){
        const targetCount = 14;
        if(L.enemies.length<targetCount){
          const avail = L.portals.filter(pt=>pt.cooldown<=0);
          if(avail.length>0){
            let totalW = 0;
            const weights = avail.map(pt=>{
              const dist = wrapDistLocal(pt.x,pt.y,p.x,p.y);
              const w = dist+rr(0,600);
              totalW += w;
              return w;
            });
            let r = rnd()*totalW;
            let pickIdx = 0;
            for(let i=0;i<avail.length;i++){
              r -= weights[i];
              if(r<=0){pickIdx = i;break}
            }
            spawnEnemyFromPortal(avail[pickIdx]);
            avail[pickIdx].cooldown = rr(0.9,1.8);
            L.spawnTimer = rr(0.35,0.75);
          } else L.spawnTimer = 0.15;
        } else L.spawnTimer = 0.4;
      }
    }catch(err){console.error('[localTick]',err.message)}
  };

  for(let i=0;i<10;i++){
    const pt = L.portals[i%Math.max(1,L.portals.length)];
    if(pt)spawnEnemyFromPortal(pt);
  }
  L.emitState = function(){
    if(!L.onMessage)return;
    const p = L.player;
    try{
      const state = {
        t:'state',tick:L.tick,
        me:{
          x:p.x,y:p.y,a:p.angle,al:p.alive?1:0,
          hp:p.hp,mhp:pMaxHpClient(p.level,p.charId),
          dmg:pDamageClient(p.level),
          k:p.kills,d:p.deaths,lv:p.level,xp:p.xp,xn:p.xpNeed,
          sp:p.spawnProt,sc:p.shieldCharge,bf:p.blockFlash,
          rs:p.respawn,dc:p.dashCd,ac:p.atkCd,
          ack:L.lastAckSeq||0
        },
        p:[],
        e:L.enemies.filter(e=>!e.dead).map(e=>({
          id:e.id,ty:e.typeId,x:e.x,y:e.y,a:e.angle,
          h:e.hue,sa:e.spawnAnim,wp:e.walkPhase,wb:e.wobblePhase,
          hp:e.hp,mhp:MONSTER_TYPES[e.typeId].hp||1,
          kn:e.knockTime>0?1:0
        })),
        ar:L.arrows.map(a=>({id:a.id,ownerId:a.ownerId,x:a.x,y:a.y,a:a.angle,h:a.hue})),
        w:L.waves.map(w=>({id:w.id,ownerId:w.ownerId,x:w.x,y:w.y,a:w.angle,l:w.life,ml:w.maxLife,h:w.hue})),
        lb:[{id:1,name:p.name,kills:p.kills,deaths:p.deaths,level:p.level,team:p.team,hue:p.hue}]
      };
      L.onMessage(state);
      if(L.events.length){
        L.onMessage({t:'ev',ev:L.events.slice()});
        L.events.length = 0;
      }
    }catch(err){console.error('[localEmit]',err.message)}
  };
  return L;
}

function addParticle(x,y,hue,life,spd,size){
  if(particles.length>=MAX_PARTICLES)return;
  const a = rand(0,TAU),s = rand(40,260)*(spd||1);
  particles.push({
    x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
    life:life||0.6,max:life||0.6,
    hue:hue+rand(-18,18),size:size||rand(2,5)
  });
}
function burst(x,y,hue,count){
  const n = count||30;
  for(let i=0;i<n;i++)addParticle(x,y,hue,rand(0.32,0.9),rand(0.7,1.5),rand(2,6));
  const extra = Math.min(10,Math.floor(n/3));
  for(let i=0;i<extra;i++)addParticle(x,y,0,rand(0.45,1.0),rand(0.4,0.9),rand(3,7));
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx -= p.vx*3.2*dt; p.vy -= p.vy*3.2*dt;
    p.life -= dt;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r = rings[i];
    r.r += (r.maxR-r.r)*(1-Math.pow(0.008,dt));
    r.life -= dt;
    if(r.life<=0)rings.splice(i,1);
  }
}
function makeDecorSprite(hue,r){
  const size = Math.ceil(r*14);
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const cx = size/2;
  const g2 = c.getContext('2d');
  const gOuter = g2.createRadialGradient(cx,cx,0,cx,cx,size/2);
  gOuter.addColorStop(0.0,'hsla('+hue+',90%,72%,0.55)');
  gOuter.addColorStop(0.35,'hsla('+hue+',90%,68%,0.22)');
  gOuter.addColorStop(1.0,'hsla('+hue+',90%,68%,0)');
  g2.fillStyle = gOuter; g2.fillRect(0,0,size,size);
  const gCore = g2.createRadialGradient(cx,cx,0,cx,cx,r*2.2);
  gCore.addColorStop(0,'hsla('+hue+',98%,95%,1)');
  gCore.addColorStop(0.5,'hsla('+hue+',95%,82%,0.95)');
  gCore.addColorStop(1,'hsla('+hue+',95%,68%,0)');
  g2.fillStyle = gCore;
  g2.beginPath(); g2.arc(cx,cx,r*2.2,0,TAU); g2.fill();
  return c;
}
function genDecors(){
  decors.length = 0;
  for(let i=0;i<650;i++){
    const hue = randi(160,290);
    const r = rand(0.8,2.4);
    const sprite = makeDecorSprite(hue,r);
    decors.push({
      x:rand(0,WSZ),y:rand(0,WSZ),r,hue,ph:rand(0,TAU),
      sprite,spriteR:sprite.width/2
    });
  }
}

/* ═══ ورودی‌ها ═══ */
const input = {attack:false,aimX:0,aimY:0,aimActive:false};
const key = {};
let dashQueued = false,attackQueued = false,gameActive = false;
let atkPointerId = null,dashPointerId = null,joyPointerId = null,chatOpen = false;
let _dashCooldownLocal = 0;
let hasFinePointer = false;

const joy = {
  active:false,baseX:0,baseY:0,restX:0,restY:0,knobX:0,knobY:0,
  radius:90,deadzone:0.10,targetX:0,targetY:0,outX:0,outY:0,displayX:0,displayY:0
};
const btn = {
  atkX:0,atkY:0,atkR:0,dashX:0,dashY:0,dashR:0,
  atkPressed:false,dashPressed:false
};

function updateUILayout(){
  const m = 18,minS = Math.min(W,H);
  joy.radius = Math.max(50,Math.min(80,minS*0.13));
  joy.restX = m+joy.radius+12;
  joy.restY = H-m-joy.radius-12;

  const joyDemo = document.getElementById('joyDemo');
  if(joyDemo){
    joyDemo.style.width  = (joy.radius*2)+'px';
    joyDemo.style.height = (joy.radius*2)+'px';
  }

  btn.atkR = Math.max(38,Math.min(52,minS*0.10));
  btn.dashR = btn.atkR*0.78;
  btn.dashX = W-m-btn.dashR-4;
  btn.dashY = H-m-btn.dashR-4;
  btn.atkX = btn.dashX-btn.dashR-btn.atkR-16;
  btn.atkY = btn.dashY-(btn.atkR-btn.dashR);
  joy.baseX = joy.restX;
  joy.baseY = joy.restY;
  if(!joy.active){
    joy.knobX = joy.baseX; joy.knobY = joy.baseY;
    joy.displayX = joy.baseX; joy.displayY = joy.baseY;
  }
}
function pointerInCircle(px,py,cx,cy,r){const dx = px-cx,dy = py-cy;return dx*dx+dy*dy<=r*r}
function activateJoy(id,px,py){
  joyPointerId = id; joy.active = true;
  joy.baseX = joy.restX; joy.baseY = joy.restY;
  updateJoy(px,py);
  joy.displayX = joy.knobX; joy.displayY = joy.knobY;
}
function updateJoy(px,py){
  if(!joy.active)return;
  const dx = px-joy.baseX,dy = py-joy.baseY;
  const d = Math.hypot(dx,dy),R = joy.radius;
  const knobD = Math.min(d,R);
  if(d>0.001){
    joy.knobX = joy.baseX+(dx/d)*knobD;
    joy.knobY = joy.baseY+(dy/d)*knobD;
  } else {
    joy.knobX = joy.baseX; joy.knobY = joy.baseY;
  }
  let tx = 0,ty = 0;
  if(d>0.5){
    const rawMag = Math.min(d/R,1);
    let mag = 0;
    if(rawMag>joy.deadzone){
      const k = (rawMag-joy.deadzone)/(1-joy.deadzone);
      mag = Math.pow(k,1.35);
    }
    tx = (dx/d)*mag; ty = (dy/d)*mag;
  }
  if(!isFiniteNum(tx))tx = 0;
  if(!isFiniteNum(ty))ty = 0;
  joy.targetX = tx; joy.targetY = ty;
}
function releaseJoy(){
  joyPointerId = null; joy.active = false;
  joy.targetX = 0; joy.targetY = 0;
  joy.baseX = joy.restX; joy.baseY = joy.restY;
  joy.knobX = joy.baseX; joy.knobY = joy.baseY;
  joy.displayX = joy.baseX; joy.displayY = joy.baseY;
}
function queueDash(){
  if(!gameActive||!player.alive)return;
  const now = performance.now();
  if(now<_dashCooldownLocal)return;
  if(player.dashTime>0)return;
  if(!isFiniteNum(player.dashCd))player.dashCd = 0;
  if(player.dashCd>0.05)return;
  dashQueued = true;
  vibrate(15);
  _dashCooldownLocal = now+pDashCdClient(player.charId,player.level)*1000;
}
function resetInput(){
  input.attack = false;
  attackQueued = false;
  input.aimActive = false;
  dashQueued = false;
  atkPointerId = null; dashPointerId = null; joyPointerId = null;
  btn.atkPressed = false; btn.dashPressed = false;
  for(const k in key)key[k] = false;
  releaseJoy();
}

function getBtnHit(el, scale){
  if(!el)return null;
  const r = el.getBoundingClientRect();
  if(r.width<=0)return null;
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;
  const rad = Math.max(r.width, r.height)/2 * (scale||1);
  return {cx, cy, rad};
}

function handleDown(id,x,y){
  if(!gameActive||chatOpen)return;
  initAudio();
  if(actx&&actx.state==='suspended')actx.resume();

  const dashHit = getBtnHit(btnDashEl, 1.55);
  const atkHit  = getBtnHit(btnAttackEl, 1.25);

  if(dashPointerId===null && dashHit && pointerInCircle(x,y,dashHit.cx,dashHit.cy,dashHit.rad)){
    dashPointerId = id; btn.dashPressed = true; queueDash(); return;
  }
  if(atkPointerId===null && atkHit && pointerInCircle(x,y,atkHit.cx,atkHit.cy,atkHit.rad)){
    atkPointerId = id;
    input.attack = true;
    attackQueued = true;
    input.aimActive = true;
    input.aimX = x; input.aimY = y;
    btn.atkPressed = true;
    vibrate(8);
    return;
  }
  if(!hasFinePointer && x<W*0.5){
    if(joyPointerId===null)activateJoy(id,x,y);
    return;
  }
  if(atkPointerId===null){
    atkPointerId = id;
    input.attack = true;
    attackQueued = true;
    input.aimActive = true;
    input.aimX = x; input.aimY = y;
    btn.atkPressed = true;
  }
}
function handleMove(id,x,y){
  if(!gameActive)return;
  if(id===joyPointerId&&joy.active)updateJoy(x,y);
  if(id===atkPointerId){input.aimX = x; input.aimY = y; input.aimActive = true}
}
function handleUp(id){
  if(id===joyPointerId)releaseJoy();
  if(id===atkPointerId){
    atkPointerId = null;
    input.attack = false;
    input.aimActive = false;
    btn.atkPressed = false;
  }
  if(id===dashPointerId){dashPointerId = null; btn.dashPressed = false}
}
function onTouchStart(e){
  if(!gameActive)return;
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const tc = e.changedTouches[i];
    handleDown(tc.identifier,tc.clientX,tc.clientY);
  }
}
function onTouchMove(e){
  if(!gameActive)return;
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const tc = e.changedTouches[i];
    handleMove(tc.identifier,tc.clientX,tc.clientY);
  }
}
function onTouchEnd(e){
  if(!gameActive)return;
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++)handleUp(e.changedTouches[i].identifier);
}
canvas.addEventListener('touchstart',onTouchStart,{passive:false});
canvas.addEventListener('touchmove',onTouchMove,{passive:false});
canvas.addEventListener('touchend',onTouchEnd,{passive:false});
canvas.addEventListener('touchcancel',onTouchEnd,{passive:false});

let mouseDown = false;
canvas.addEventListener('mousedown',e=>{
  if(!gameActive||chatOpen)return;
  if(e.button!==0)return;
  initAudio();
  mouseDown = true;
  handleDown('mouse',e.clientX,e.clientY);
});
canvas.addEventListener('mousemove',e=>{
  if(!gameActive)return;
  if(hasFinePointer){
    input.aimX = e.clientX; input.aimY = e.clientY;
    input.aimActive = true;
  } else if(mouseDown){
    handleMove('mouse',e.clientX,e.clientY);
  }
});
canvas.addEventListener('mouseleave',()=>{if(hasFinePointer)input.aimActive = false});
window.addEventListener('mouseup',e=>{
  if(e.button!==0)return;
  if(mouseDown){mouseDown = false; handleUp('mouse')}
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  const tag = (e.target&&e.target.tagName)||'';
  const isEditable = tag==='INPUT'||tag==='TEXTAREA'||(e.target&&e.target.isContentEditable);
  if(isEditable){
    if(e.code==='Escape')e.target.blur();
    return;
  }
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(key[e.code])return;
  key[e.code] = true;
  if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='Space')queueDash();
  if(e.code==='Enter'){e.preventDefault();toggleChat()}
  if(e.code==='KeyL')toggleLeaderboard();
});
window.addEventListener('keyup',e=>{key[e.code] = false});
window.addEventListener('blur',()=>{resetInput(); mouseDown = false});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  if(gameActive&&!NET.offline&&!NET.connected&&NET._reconnectInfo&&!NET._intentionalClose){
    if(NET._reconnectTimer)return;
    NET._reconnectAttempts = 0;
    cancelReconnect();
    const info = NET._reconnectInfo;
    connectToServer(info.url,info.name,info.charId,info.team,info.color)
      .then(()=>{NET._reconnectAttempts = 0})
      .catch(()=>scheduleReconnect());
  }
});

try{
