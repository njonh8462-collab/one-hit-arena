const sDmg = document.getElementById('sDmg');
const sAtk = document.getElementById('sAtk');
const sSpd = document.getElementById('sSpd');
const sLvl = document.getElementById('sLvl');
let hudTimer = 0;

function updateHUD(){
  if(hKills)hKills.textContent = faNum(player.kills||0);
  if(hDeaths)hDeaths.textContent = faNum(player.deaths||0);
  if(hLevel)hLevel.textContent = faNum(player.level||1);
  if(lvlBarFill){
    const need = Math.max(1,player.xpNeed||1);
    const pct = ((player.xp||0)/need)*100;
    lvlBarFill.style.width = Math.min(100,Math.max(0,pct))+'%';
  }
  if(teamBadge){
    if(player.team==='ffa')teamBadge.classList.remove('on');
    else {
      const t = TEAMS[player.team];
      if(t){
        teamBadge.classList.add('on');
        teamBadge.style.color = 'hsl('+t.hue+',85%,78%)';
        teamBadge.style.borderColor = 'hsl('+t.hue+',85%,55%)';
        teamBadge.textContent = 'تیم '+t.name;
      }
    }
  }
  const mhp = (isFiniteNum(player.maxHp)&&player.maxHp>0)
    ? player.maxHp
    : pMaxHpClient(player.level||1,player.charId);
  const curHp = isFiniteNum(player.hp) ? clamp(Math.round(player.hp),0,mhp) : mhp;
  if(sHp)sHp.textContent = faNum(curHp)+'/'+faNum(mhp);
  if(sDmg)sDmg.textContent = faNum(player.damage||pDamageClient(player.level||1));
  /* ✅ v14.4 — نمایش CD واقعی حمله (همگام با سرور) */
  if(sAtk)sAtk.textContent = faNumF(pCdClient(player.charId, player.level||1), 2);
  if(sSpd)sSpd.textContent = faNum(Math.round(pSpeedClient(player.charId,player.level||1)));
  if(sLvl)sLvl.textContent = faNum(player.level||1);
}

let toastEl = null,toastTimer = null;
function showToast(msg){
  if(!toastEl){
    toastEl = document.createElement('div');
    toastEl.className = 'toastEl';
    document.body.appendChild(toastEl);
  }
  toastEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><path d="M5 12 l5 5 L20 6"/></svg>'+msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('on'),1600);
}

/* ═══ چت ═══ */
const chatStage = document.getElementById('chatStage');
const CHAT = {
  max:4, lifeMs:6000, timers:new WeakMap(),
  add(name,text){
    if(!chatStage)return;
    const bubble = document.createElement('div');
    bubble.className = 'chatBubble';
    bubble.innerHTML = '<b>'+escapeHtml(name)+':</b> '+escapeHtml(text);
    chatStage.appendChild(bubble);
    while(chatStage.children.length>this.max)this.remove(chatStage.firstChild);
    const t = setTimeout(()=>this.remove(bubble),this.lifeMs);
    this.timers.set(bubble,t);
  },
  remove(bubble){
    if(!bubble||!bubble.parentNode)return;
    const t = this.timers.get(bubble);
    if(t){clearTimeout(t); this.timers.delete(bubble)}
    bubble.classList.add('leaving');
    setTimeout(()=>bubble.remove(),500);
  }
};
function addChatMessage(msg,animate){
  CHAT.add(msg.from,msg.text);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const chatInputWrap = document.getElementById('chatInputWrap');
const chatInput = document.getElementById('chatInput');
const chatBtn = document.getElementById('chatBtn');
function toggleChat(){
  if(!gameActive)return;
  chatOpen = !chatOpen;
  if(chatOpen){chatInputWrap.classList.add('on'); chatInput.focus()}
  else {chatInputWrap.classList.remove('on'); chatInput.blur(); resetInput()}
}
if(chatBtn)chatBtn.addEventListener('click',toggleChat);
const chatSendBtn = document.getElementById('chatSend');
if(chatSendBtn){
  chatSendBtn.addEventListener('click',()=>{
    const text = chatInput.value.trim();
    if(text)sendToServer({t:'chat',text});
    chatInput.value = '';
    toggleChat();
  });
}
if(chatInput){
  chatInput.addEventListener('keydown',e=>{
    if(e.code==='Enter'){
      e.preventDefault();
      const text = chatInput.value.trim();
      if(text)sendToServer({t:'chat',text});
      chatInput.value = '';
      toggleChat();
    }
    if(e.code==='Escape')toggleChat();
  });
}

const lbModal = document.getElementById('lbModal');
const lbBody = document.getElementById('lbBody');
const lbBtn = document.getElementById('lbBtn');
const lbClose = document.getElementById('lbClose');
if(lbBtn)lbBtn.addEventListener('click',toggleLeaderboard);
if(lbClose)lbClose.addEventListener('click',()=>lbModal.classList.remove('on'));

function toggleLeaderboard(){
  if(!gameActive)return;
  lbModal.classList.toggle('on');
  if(lbModal.classList.contains('on'))renderLeaderboard();
}

function renderLeaderboard(){
  if(!lbBody)return;
  lbBody.innerHTML = '';
  let list = Array.isArray(NET.leaderboard)?NET.leaderboard.slice():[];
  list = list.filter(p=>p&&typeof p==='object'&&p.id!=null);
  const myId = NET.myId;
  if(player&&player.name&&!list.some(p=>p.id===myId)){
    list.push({
      id:myId,name:player.name,
      kills:player.kills||0,deaths:player.deaths||0,
      level:player.level||1,team:player.team||'ffa',
      hue:isFiniteNum(player.hue)?player.hue:205
    });
  }
  list.sort((a,b)=>((b.kills||0)-(a.kills||0))||((a.deaths||0)-(b.deaths||0))||((b.level||1)-(a.level||1)));
  if(list.length===0){
    lbBody.innerHTML = '<div style="text-align:center;color:#7d93b4;padding:20px;font-size:12px">در انتظار داده از سرور…</div>';
    return;
  }
  list.forEach((p,i)=>{
    const row = document.createElement('div');
    row.className = 'lbRow'+(p.id===NET.myId?' me':'');
    const team = TEAMS[p.team]||TEAMS.ffa;
    const tcolor = team.hue===null?'#7ec8ff':'hsl('+team.hue+',85%,60%)';
    const hueVal = isFiniteNum(p.hue)?p.hue:205;
    const rk = i===0?'gold':i===1?'silver':i===2?'bronze':'';
    row.innerHTML = '<div class="lbRank '+rk+'">'+faNum(i+1)+'</div>'+
      '<div class="lbName" style="color:hsl('+hueVal+',80%,75%)">'+escapeHtml(p.name||'')+'</div>'+
      '<div class="lbStat">'+faNum(p.kills||0)+' / '+faNum(p.deaths||0)+'</div>'+
      '<div class="lbTeam" style="background:'+tcolor+'22;color:'+tcolor+'">'+team.name+'</div>';
    lbBody.appendChild(row);
  });
}

/* ═══ مینی‌مپ ═══ */
const minimapCanvas = document.getElementById('minimap');
const mmCtx = minimapCanvas?minimapCanvas.getContext('2d'):null;
const coordLabel = document.getElementById('coordLabel');
let mmDpr = 1;

function setupMinimap(){
  if(!minimapCanvas)return;
  mmDpr = Math.min(window.devicePixelRatio||1,2);
  const size = 76;
  minimapCanvas.width = size*mmDpr;
  minimapCanvas.height = size*mmDpr;
  minimapCanvas.style.width = size+'px';
  minimapCanvas.style.height = size+'px';
}

function drawMinimap(){
  if(!mmCtx)return;
  const size = 76;
  const R = size/2;
  const viewRange = 1100;
  const worldPerPx = viewRange/R;

  mmCtx.setTransform(mmDpr,0,0,mmDpr,0,0);
  mmCtx.clearRect(0,0,size,size);

  mmCtx.save();
  mmCtx.beginPath();
  mmCtx.arc(R,R,R,0,TAU);
  mmCtx.clip();

  mmCtx.fillStyle = 'rgba(6,12,22,0.95)';
  mmCtx.fillRect(0,0,size,size);

  mmCtx.strokeStyle = 'rgba(120,180,255,0.12)';
  mmCtx.lineWidth = 1;
  const gridStep = 500;
  const pxStep = gridStep/worldPerPx;
  const offX = ((player.x%gridStep)/gridStep)*pxStep;
  const offY = ((player.y%gridStep)/gridStep)*pxStep;
  mmCtx.beginPath();
  for(let gx = R-offX;gx<=size+pxStep;gx+=pxStep){mmCtx.moveTo(gx,0);mmCtx.lineTo(gx,size)}
  for(let gx = R-offX;gx>=-pxStep;gx-=pxStep){mmCtx.moveTo(gx,0);mmCtx.lineTo(gx,size)}
  for(let gy = R-offY;gy<=size+pxStep;gy+=pxStep){mmCtx.moveTo(0,gy);mmCtx.lineTo(size,gy)}
  for(let gy = R-offY;gy>=-pxStep;gy-=pxStep){mmCtx.moveTo(0,gy);mmCtx.lineTo(size,gy)}
  mmCtx.stroke();

  for(const o of obstacles){
    const dx = wrapDelta(o.x,player.x);
    const dy = wrapDelta(o.y,player.y);
    if(Math.abs(dx)>viewRange||Math.abs(dy)>viewRange)continue;
    const mx = R+dx/worldPerPx;
    const my = R+dy/worldPerPx;
    mmCtx.fillStyle = 'rgba(120,140,170,0.6)';
    mmCtx.beginPath();
    mmCtx.arc(mx,my,Math.max(1,o.r/worldPerPx),0,TAU);
    mmCtx.fill();
  }

  for(const p of PORTALS){
    const dx = wrapDelta(p.x,player.x);
    const dy = wrapDelta(p.y,player.y);
    if(Math.abs(dx)>viewRange||Math.abs(dy)>viewRange)continue;
    const mx = R+dx/worldPerPx;
    const my = R+dy/worldPerPx;
    mmCtx.strokeStyle = 'hsl('+p.hue+',90%,65%)';
    mmCtx.lineWidth = 1.4;
    mmCtx.beginPath();
    mmCtx.arc(mx,my,3,0,TAU);
    mmCtx.stroke();
  }

  for(const [,e] of NET.remoteEnemies){
    const dx = wrapDelta(e.x,player.x);
    const dy = wrapDelta(e.y,player.y);
    if(Math.abs(dx)>viewRange||Math.abs(dy)>viewRange)continue;
    const mx = R+dx/worldPerPx;
    const my = R+dy/worldPerPx;
    mmCtx.fillStyle = 'hsl('+((e.curr&&e.curr.h)||0)+',90%,60%)';
    mmCtx.beginPath();
    mmCtx.arc(mx,my,2.2,0,TAU);
    mmCtx.fill();
  }

  for(const [,rp] of NET.remotePlayers){
    const c = rp.curr;
    if(!c.al)continue;
    const dx = wrapDelta(rp.x,player.x);
    const dy = wrapDelta(rp.y,player.y);
    if(Math.abs(dx)>viewRange||Math.abs(dy)>viewRange)continue;
    const mx = R+dx/worldPerPx;
    const my = R+dy/worldPerPx;
    let color = 'rgba(255,160,120,0.95)';
    if(player.team!=='ffa')color = (c.tm===player.team)?'rgba(120,255,150,0.95)':'rgba(255,120,120,0.95)';
    mmCtx.fillStyle = color;
    mmCtx.beginPath();
    mmCtx.arc(mx,my,2.8,0,TAU);
    mmCtx.fill();
  }

  mmCtx.fillStyle = 'hsl('+(player.hue||205)+',90%,70%)';
  mmCtx.beginPath();
  mmCtx.arc(R,R,3.4,0,TAU);
  mmCtx.fill();
  mmCtx.strokeStyle = '#fff';
  mmCtx.lineWidth = 1.4;
  mmCtx.stroke();

  mmCtx.strokeStyle = 'rgba(255,255,255,0.9)';
  mmCtx.lineWidth = 1.6;
  mmCtx.beginPath();
  mmCtx.moveTo(R,R);
  mmCtx.lineTo(R+Math.cos(player.angle)*8,R+Math.sin(player.angle)*8);
  mmCtx.stroke();

  mmCtx.restore();

  mmCtx.fillStyle = 'rgba(255,215,100,0.95)';
  mmCtx.font = 'bold 10px Tahoma, sans-serif';
  mmCtx.textAlign = 'center';
  mmCtx.textBaseline = 'top';
  mmCtx.fillText('ش',R,2);

  if(coordLabel){
    coordLabel.textContent = 'ایکس '+faNum(Math.round(player.x))+' · وای '+faNum(Math.round(player.y));
  }
}

function drawMonsterView(e){
  const t = MONSTER_TYPES[e.ty]||MONSTER_TYPES.slime;
  const R = t.radius;
  const sa = (typeof e.sa==='number')?e.sa:0;
  const total = CFG.emergeDuration;
  const progress = 1-clamp(sa/total,0,1);
  const alpha = sa>0?clamp(0.15+progress*0.85,0,1):1;
  const spawnScale = sa>0?(0.35+progress*0.65):1;
  if(!isFiniteNum(e.x)||!isFiniteNum(e.y))return;
  if(sa>0){
    ctx.save();
    ctx.translate(e.x,e.y);
    ctx.globalCompositeOperation = 'lighter';
    const a = clamp(sa/total,0,1);
    const beam = ctx.createRadialGradient(0,0,2,0,0,R*(2.4+a*2.4));
    beam.addColorStop(0,'hsla('+(e.h||200)+',95%,88%,'+(0.55*a+0.18)+')');
    beam.addColorStop(0.5,'hsla('+(e.h||200)+',95%,70%,'+(0.32*a)+')');
    beam.addColorStop(1,'hsla('+(e.h||200)+',95%,60%,0)');
    ctx.fillStyle = beam;
    ctx.beginPath(); ctx.arc(0,0,R*(2.4+a*2.4),0,TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  }
  ctx.save();
  ctx.translate(e.x,e.y);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.beginPath(); ctx.ellipse(2,R*0.55,R*1.05,R*0.6,0,0,TAU); ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  const aura = ctx.createRadialGradient(0,0,R*0.3,0,0,R*2.6);
  aura.addColorStop(0,'hsla('+(e.h||0)+',95%,62%,0.3)');
  aura.addColorStop(1,'hsla('+(e.h||0)+',95%,62%,0)');
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(0,0,R*2.6,0,TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.scale(spawnScale,spawnScale);
  ctx.rotate(e.angle||0);
  const wob = Math.sin(e.wb||0)*1.5*t.wobble;
  if(e.ty==='slime'){
    const g = ctx.createRadialGradient(-R*0.3,-R*0.4,R*0.1,0,0,R*1.2);
    g.addColorStop(0,'hsla('+(e.h||0)+',95%,78%,0.95)');
    g.addColorStop(0.55,'hsla('+(e.h||0)+',85%,52%,0.9)');
    g.addColorStop(1,'hsla('+(e.h||0)+',85%,30%,0.9)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0,wob,R,R*1.05-wob*0.5,0,0,TAU); ctx.fill();
  } else if(e.ty==='skeleton'){
    const g = ctx.createLinearGradient(-R,-R,R,R);
    g.addColorStop(0,'#f4f0dc'); g.addColorStop(0.5,'#c8bfa0'); g.addColorStop(1,'#6e6650');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0,0,R*0.85,R*1,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.35,0,R*0.62,0,TAU); ctx.fill();
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath(); ctx.arc(R*0.55,-R*0.22,R*0.15,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.55,R*0.22,R*0.15,0,TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,90,60,0.9)';
    ctx.beginPath(); ctx.arc(R*0.55,-R*0.22,R*0.07,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.55,R*0.22,R*0.07,0,TAU); ctx.fill();
  } else if(e.ty==='demon'){
    const g = ctx.createRadialGradient(-R*0.3,-R*0.4,R*0.15,0,0,R*1.2);
    g.addColorStop(0,'#ff8866'); g.addColorStop(0.5,'#c01818'); g.addColorStop(1,'#4a0810');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0,0,R*0.9,R*1.05,0,0,TAU); ctx.fill();
    ctx.fillStyle = '#2a1810';
    ctx.beginPath(); ctx.moveTo(R*0.2,-R*0.5); ctx.lineTo(R*0.45,-R*1.35); ctx.lineTo(R*0.55,-R*0.35); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(R*0.2,R*0.5); ctx.lineTo(R*0.45,R*1.35); ctx.lineTo(R*0.55,R*0.35); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,220,60,0.95)';
    ctx.beginPath(); ctx.arc(R*0.5,-R*0.28,R*0.14,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.5,R*0.28,R*0.14,0,TAU); ctx.fill();
  } else if(e.ty==='ghost'){
    const g = ctx.createRadialGradient(0,-R*0.2,R*0.1,0,0,R*1.5);
    g.addColorStop(0,'hsla('+(e.h||0)+',95%,80%,0.85)');
    g.addColorStop(0.6,'hsla('+(e.h||0)+',85%,55%,0.55)');
    g.addColorStop(1,'hsla('+(e.h||0)+',85%,35%,0.05)');
    ctx.fillStyle = g;
    const tail = Math.sin(e.wb||0)*R*0.4;
    ctx.beginPath();
    ctx.moveTo(-R,0);
    ctx.quadraticCurveTo(-R*1.1,-R*0.9,0,-R);
    ctx.quadraticCurveTo(R*1.1,-R*0.9,R,0);
    ctx.quadraticCurveTo(R*0.7,R*0.6+tail,R*0.3,R*0.55);
    ctx.quadraticCurveTo(0,R*0.8-tail,-R*0.3,R*0.55);
    ctx.quadraticCurveTo(-R*0.7,R*0.6+tail,-R,0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.arc(R*0.3,-R*0.25,R*0.14,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.3,R*0.25,R*0.14,0,TAU); ctx.fill();
  } else if(e.ty==='golem'){
    const g = ctx.createLinearGradient(-R,-R,R,R);
    g.addColorStop(0,'#a88860'); g.addColorStop(0.4,'#6a5238'); g.addColorStop(1,'#2e2318');
    ctx.fillStyle = g;
    ctx.beginPath();
    const n = 7;
    for(let i=0;i<n;i++){
      const a = i/n*TAU,rr = R+hash01((e.wb||0)+i*13)*R*0.15;
      ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(30,20,10,0.7)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,180,60,0.95)';
    ctx.beginPath(); ctx.arc(R*0.45,0,R*0.16,0,TAU); ctx.fill();
  } else {
    const g = ctx.createRadialGradient(-R*0.3,-R*0.4,R*0.1,0,0,R*1.4);
    g.addColorStop(0,'hsla('+(e.h||0)+',80%,55%,0.95)');
    g.addColorStop(0.55,'hsla('+(e.h||0)+',70%,28%,0.92)');
    g.addColorStop(1,'hsla('+(e.h||0)+',80%,10%,0.85)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(R*1.1,0);
    ctx.quadraticCurveTo(R*0.3,-R*0.8,-R*0.8,-R*0.9);
    ctx.quadraticCurveTo(-R*0.5,0,-R*0.8,R*0.9);
    ctx.quadraticCurveTo(R*0.3,R*0.8,R*1.1,0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'hsla('+(e.h||0)+',70%,15%,0.95)';
    ctx.beginPath(); ctx.arc(R*0.1,0,R*0.62,0,TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawSword(len,bladeW){
  ctx.fillStyle = '#2a1508';
  ctx.beginPath(); ctx.roundRect(-4,-2.2,10,4.4,2); ctx.fill();
  ctx.fillStyle = '#8a6a3a';
  for(let i=0;i<3;i++){ctx.beginPath(); ctx.arc(-1+i*3,0,0.9,0,TAU); ctx.fill()}
  const pom = ctx.createRadialGradient(-6,-1,0.4,-5,0,3.2);
  pom.addColorStop(0,'#ffe9a8'); pom.addColorStop(0.6,'#d4af37'); pom.addColorStop(1,'#6a4a14');
  ctx.fillStyle = pom;
  ctx.beginPath(); ctx.arc(-5,0,3,0,TAU); ctx.fill();
  const bl = ctx.createLinearGradient(0,-bladeW,0,bladeW);
  bl.addColorStop(0,'rgba(255,255,255,0.98)');
  bl.addColorStop(0.5,'rgba(108,132,160,0.95)');
  bl.addColorStop(1,'rgba(255,255,255,0.98)');
  ctx.fillStyle = bl;
  ctx.beginPath();
  ctx.moveTo(9,-bladeW); ctx.lineTo(len-6,-bladeW*0.55);
  ctx.lineTo(len,0); ctx.lineTo(len-6,bladeW*0.55);
  ctx.lineTo(9,bladeW); ctx.lineTo(11,0);
  ctx.closePath(); ctx.fill();
}

function drawWarrior(x,y,angle,walkPhase,attacking,attackProg,hue,level,charId){
  if(!isFiniteNum(x)||!isFiniteNum(y))return;
  const char = CHARACTERS[charId]||CHARACTERS.warrior;
  const safeAngle = isFiniteNum(angle)?angle:0;
  const safeWP = isFiniteNum(walkPhase)?walkPhase:0;
  const safeHue = isFiniteNum(hue)?hue:(char.hue||205);
  const safeLevel = isFiniteNum(level)?level:1;
  const safeProg = isFiniteNum(attackProg)?clamp(attackProg,0,1):0;
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle = 'rgba(0,0,0,0.48)';
  ctx.beginPath(); ctx.ellipse(3,8,18,9,0,0,TAU); ctx.fill();
  ctx.rotate(safeAngle);
  const bob = Math.sin(safeWP)*1.6;
  const lvlGlow = Math.min(1,(safeLevel-1)*0.05);
  const capeWave = Math.sin(safeWP*0.7)*3;
  const capeGrad = ctx.createLinearGradient(-30,0,-6,0);
  capeGrad.addColorStop(0,'hsla('+safeHue+',65%,18%,0.55)');
  capeGrad.addColorStop(1,'hsla('+safeHue+',75%,40%,0.95)');
  ctx.fillStyle = capeGrad;

function drawRock(o){
  ctx.save();
  ctx.translate(o.x,o.y);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(7,11,o.r*1.05,o.r*0.72,0,0,TAU); ctx.fill();
  ctx.rotate(o.rot||0);
  ctx.beginPath();
  ctx.moveTo(o.pts[0].x,o.pts[0].y);
  for(let i=1;i<o.pts.length;i++)ctx.lineTo(o.pts[i].x,o.pts[i].y);
  ctx.closePath();
  const g = ctx.createLinearGradient(-o.r,-o.r,o.r,o.r);
  g.addColorStop(0,'#3d4d66'); g.addColorStop(0.5,'#26324a'); g.addColorStop(1,'#131a28');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(130,180,240,0.3)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

/* ═══ حرکت ═══ */
function movePlayerLocal(dt){
  if(!player.alive){dashQueued = false; return}
  if(!NET.offline&&!NET.connected){player.vx = 0; player.vy = 0; dashQueued = false; return}
  let ix = joy.outX,iy = joy.outY;
  let kx = 0,ky = 0;
  if(key['KeyW']||key['ArrowUp'])ky--;
  if(key['KeyS']||key['ArrowDown'])ky++;
  if(key['KeyA']||key['ArrowLeft'])kx--;
  if(key['KeyD']||key['ArrowRight'])kx++;
  const km = Math.hypot(kx,ky);
  if(km>0){kx/=km; ky/=km; ix = kx; iy = ky}
  if(!isFiniteNum(ix))ix = 0;
  if(!isFiniteNum(iy))iy = 0;
  const moving = Math.hypot(ix,iy)>0.02;

  if(!isFiniteNum(player.x)||!isFiniteNum(player.y)){
    player.x = WSZ/2; player.y = WSZ/2;
    player.vx = 0; player.vy = 0;
    cam.x = player.x; cam.y = player.y;
  }

  let targetAngle = player.angle;
  if(hasFinePointer&&input.aimActive){
    const s = viewScale();
    const wx = (input.aimX-W/2)/s+cam.x;
    const wy = (input.aimY-H/2)/s+cam.y;
    const adx = wrapDelta(wx,player.x);
    const ady = wrapDelta(wy,player.y);
    targetAngle = Math.atan2(ady,adx);
  } else {
    let bestA = null,bestD = 1e9;
    for(const [,e] of NET.remoteEnemies){
      const dx = wrapDelta(e.x,player.x),dy = wrapDelta(e.y,player.y);
      const d = Math.hypot(dx,dy);
      if(d<bestD&&d<380){bestD = d; bestA = Math.atan2(dy,dx)}
    }
    if(bestA!==null)targetAngle = bestA;
    else if(moving)targetAngle = Math.atan2(iy,ix);
  }
  if(!isFiniteNum(targetAngle))targetAngle = player.angle;
  if(!isFiniteNum(player.angle))player.angle = 0;
  player.angle = normAng(player.angle+angDiff(targetAngle,player.angle)*Math.min(1,dt*15));
  if(!isFiniteNum(player.angle))player.angle = 0;

  if(dashQueued){
    dashQueued = false;
    if(player.dashTime<=0){
      sendToServer({t:'in',mx:ix,my:iy,aim:player.angle,atk:false,atkHeld:false,dash:true,seq:++inputSeq});
      player.dashCd = pDashCdClient(player.charId,player.level);
      player.dashTime = CFG.dashDur;
      player.dashDir = moving?Math.atan2(iy,ix):player.angle;
      SFX.dash();
      for(let i=0;i<12;i++)addParticle(player.x,player.y,player.hue,0.4,0.6,3);
    }
  }

  const spd = pSpeedClient(player.charId,player.level);
  if(player.dashTime>0){
    player.dashTime -= dt;
    const moveD = CFG.dashSpeed*(CHARACTERS[player.charId].dash||1)*dt;
    const steps = Math.max(1,Math.ceil(moveD/15));
    for(let s=0;s<steps;s++){
      player.x = wrap(player.x+Math.cos(player.dashDir)*moveD/steps);
      player.y = wrap(player.y+Math.sin(player.dashDir)*moveD/steps);
      collideObstaclesClient(player,16); collidePortalsClient(player,16);
    }
    player.walkPhase += dt*20;
  } else {
    const k = 1-Math.pow(0.0000018,dt);
    player.vx = lerp(player.vx,ix*spd,k);
    player.vy = lerp(player.vy,iy*spd,k);
    if(!isFiniteNum(player.vx))player.vx = 0;
    if(!isFiniteNum(player.vy))player.vy = 0;
    const vx = player.vx*dt,vy = player.vy*dt;
    const mlen = Math.hypot(vx,vy);
    const steps = Math.max(1,Math.ceil(mlen/15));
    for(let s=0;s<steps;s++){
      player.x = wrap(player.x+vx/steps);
      player.y = wrap(player.y+vy/steps);
      collideObstaclesClient(player,16); collidePortalsClient(player,16);
    }
    player.walkPhase += moving?dt*11:dt*2.5;
  }

  if(player.correctX||player.correctY){
    const corrK = 1-Math.pow(CFG.errorSmoothing,dt);
    const cx = player.correctX*corrK;
    const cy = player.correctY*corrK;
    player.x = wrap(player.x+cx);
    player.y = wrap(player.y+cy);
    player.correctX -= cx;
    player.correctY -= cy;
    if(Math.abs(player.correctX)<0.5&&Math.abs(player.correctY)<0.5){
      player.correctX = 0; player.correctY = 0;
    }
  }

  if(!isFiniteNum(player.x)||!isFiniteNum(player.y)){
    player.x = WSZ/2; player.y = WSZ/2;
    player.vx = 0; player.vy = 0;
    player.correctX = 0; player.correctY = 0;
    cam.x = player.x; cam.y = player.y;
  }
}

function updateLocalArrows(dt){
  for(let i=localArrows.length-1;i>=0;i--){
    const a = localArrows[i];
    a.x = wrap(a.x+a.vx*dt);
    a.y = wrap(a.y+a.vy*dt);
    a.life -= dt;
    let hit = false;
    for(const [,e] of NET.remoteEnemies){
      const t = MONSTER_TYPES[e.curr&&e.curr.ty];
      if(!t)continue;
      if(Math.hypot(wrapDelta(e.x,a.x),wrapDelta(e.y,a.y))<t.radius+6){hit = true; break}
    }
    if(!hit){
      for(const o of obstacles){
        if(Math.hypot(wrapDelta(o.x,a.x),wrapDelta(o.y,a.y))<o.r*0.82){hit = true; break}
      }
    }
    if(hit||a.life<=0)localArrows.splice(i,1);
  }
}

let lastInputSent = 0;
function sendInput(){
  const now = performance.now();
  if(now-lastInputSent<33)return;
  lastInputSent = now;
  let ix = joy.outX,iy = joy.outY;
  let kx = 0,ky = 0;
  if(key['KeyW']||key['ArrowUp'])ky--;
  if(key['KeyS']||key['ArrowDown'])ky++;
  if(key['KeyA']||key['ArrowLeft'])kx--;
  if(key['KeyD']||key['ArrowRight'])kx++;
  const km = Math.hypot(kx,ky);
  if(km>0){ix = kx/km; iy = ky/km}
  if(!isFiniteNum(ix))ix = 0;
  if(!isFiniteNum(iy))iy = 0;

  const wantAtk = player.atkCd<=0 && (attackQueued||input.attack);
  const inp = recordInput(ix,iy,player.angle,false,wantAtk);
  sendToServer({t:'in',mx:ix,my:iy,aim:player.angle,atk:wantAtk,atkHeld:input.attack,dash:false,seq:inp.seq});

  if(wantAtk){
    attackQueued = false;
    /* ✅ v14.4 — استفاده از فرمول همگام‌شده با سرور */
    player.atkCd = pCdClient(player.charId, player.level);
    player.swing = 0.16;
    player.swingDir = player.angle;
    if(player.charId==='archer'){
      SFX.bow();
      const shots = player.level>=5?[-0.13,0,0.13]:[0];
      for(const off of shots){
        const aa = player.angle+off;
        localArrows.push({
          id:'local_'+Math.random(),ownerId:NET.myId,
          x:wrap(player.x+Math.cos(aa)*22),
          y:wrap(player.y+Math.sin(aa)*22),
          vx:Math.cos(aa)*CFG.arrowSpeed,vy:Math.sin(aa)*CFG.arrowSpeed,
          angle:aa,life:1.5,hue:player.hue
        });
      }
    } else SFX.swing();
    if(player.level>=AURA_LEVEL&&window.FX){
      const type = AURA_TYPE[player.charId]||'smoke';
      const fx = player.x+Math.cos(player.angle)*40;
      const fy = player.y+Math.sin(player.angle)*40;
      try{
        if(type==='lightning')FX.addLightning(fx,fy,0.45);
        else if(type==='ice')FX.addIce(fx,fy,0.5);
        else FX.addSmoke(fx,fy,0.8);
      }catch(e){}
    }
  }
}

function update(dt){
  time += dt;
  screenFlash = Math.max(0,screenFlash-dt*1.6);
  player.blockFlash = Math.max(0,player.blockFlash-dt*1.8);

  if(!isFiniteNum(player.atkCd))player.atkCd = 0;
  if(!isFiniteNum(player.swing))player.swing = 0;
  if(!isFiniteNum(player.dashCd))player.dashCd = 0;
  if(!isFiniteNum(player.dashTime))player.dashTime = 0;
  if(!isFiniteNum(player.spawnProt))player.spawnProt = 0;
  if(!isFiniteNum(player.respawn))player.respawn = 0;
  if(!isFiniteNum(player.vx))player.vx = 0;
  if(!isFiniteNum(player.vy))player.vy = 0;
  if(!isFiniteNum(player.angle))player.angle = 0;
  if(!isFiniteNum(joy.outX))joy.outX = 0;
  if(!isFiniteNum(joy.outY))joy.outY = 0;

  if(!player.alive){
    dashQueued = false;
    attackQueued = false;
    input.attack = false;
  }

  const smoothK = 1-Math.pow(0.00004,dt);
  joy.outX = lerp(joy.outX,joy.targetX,smoothK);
  joy.outY = lerp(joy.outY,joy.targetY,smoothK);
  joy.displayX = lerp(joy.displayX,joy.knobX,1-Math.pow(0.0005,dt));
  joy.displayY = lerp(joy.displayY,joy.knobY,1-Math.pow(0.0005,dt));
  player.atkCd = Math.max(-1,player.atkCd-dt);
  player.swing = Math.max(-1,player.swing-dt);
  player.dashCd = Math.max(-1,player.dashCd-dt);
  player.spawnProt = Math.max(-1,player.spawnProt-dt);
  if(!player.alive)player.respawn = Math.max(0,player.respawn-dt);
  if(player.alive)movePlayerLocal(dt);
  sendInput();
  const now = performance.now();
  const interpDelay = NET.offline ? 0 : CFG.interpDelayMs;
  interpMap(NET.remotePlayers,now,interpDelay);
  interpMap(NET.remoteEnemies,now,interpDelay);
  interpMap(NET.remoteArrows,now,interpDelay);
  interpMap(NET.remoteWaves,now,interpDelay);
  updateLocalArrows(dt);
  updateParticles(dt);
  if(window.FX){
    try{FX.update(dt,now); tickAuras(dt,now)}catch(e){}
  }
  if(!isFiniteNum(cam.x)||!isFiniteNum(cam.y)||!isFiniteNum(player.x)||!isFiniteNum(player.y)){
    cam.x = player.x; cam.y = player.y;
  }
  const camDx = wrapDelta(player.x,cam.x);
  const camDy = wrapDelta(player.y,cam.y);
  const followK = 1-Math.pow(0.0009,dt);
  cam.x += camDx*followK;
  cam.y += camDy*followK;
  cam.x = wrap(cam.x); cam.y = wrap(cam.y);
  if(!isFiniteNum(cam.x))cam.x = player.x;
  if(!isFiniteNum(cam.y))cam.y = player.y;
  shake *= Math.pow(0.02,dt);
  if(shake<0.3)shake = 0;

  if(!isFiniteNum(joy.outX))joy.outX = 0;
  if(!isFiniteNum(joy.outY))joy.outY = 0;
  if(!isFiniteNum(joy.displayX))joy.displayX = joy.baseX;
  if(!isFiniteNum(joy.displayY))joy.displayY = joy.baseY;
}

/* ═══ رندر ═══ */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const bg = ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,Math.max(W,H)*0.8);
  bg.addColorStop(0,'#0d1729');
  bg.addColorStop(1,'#04060c');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);
  const s = viewScale();
  const sx = (Math.random()-0.5)*shake;
  const sy = (Math.random()-0.5)*shake;
  const halfW = W/(2*s),halfH = H/(2*s);
  const camLeft = cam.x-halfW,camRight = cam.x+halfW;
  const camTop = cam.y-halfH,camBottom = cam.y+halfH;
  ctx.save();
  ctx.translate(W/2+sx,H/2+sy);
  ctx.scale(s,s);
  ctx.translate(-cam.x,-cam.y);
  ctx.fillStyle = '#080d18';
  ctx.fillRect(camLeft,camTop,camRight-camLeft,camBottom-camTop);
  ctx.globalCompositeOperation = 'lighter';
  const aglow = ctx.createRadialGradient(cam.x,cam.y,60,cam.x,cam.y,Math.max(halfW,halfH)*1.6);
  aglow.addColorStop(0,'rgba(50,110,200,0.1)');
  aglow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = aglow;
  ctx.fillRect(camLeft,camTop,camRight-camLeft,camBottom-camTop);
  ctx.globalCompositeOperation = 'source-over';
  const step = 100;
  ctx.strokeStyle = 'rgba(120,180,255,0.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const firstXIdx = Math.floor(camLeft/step),lastXIdx = Math.ceil(camRight/step);
  for(let i=firstXIdx;i<=lastXIdx;i++){ctx.moveTo(i*step,camTop); ctx.lineTo(i*step,camBottom)}
  const firstYIdx = Math.floor(camTop/step),lastYIdx = Math.ceil(camBottom/step);
  for(let j=firstYIdx;j<=lastYIdx;j++){ctx.moveTo(camLeft,j*step); ctx.lineTo(camRight,j*step)}
  ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  for(const d of decors){
    const dx = wrapDelta(d.x,cam.x),dy = wrapDelta(d.y,cam.y);
    const rx = cam.x+dx,ry = cam.y+dy;
    if(rx<camLeft-40||rx>camRight+40||ry<camTop-40||ry>camBottom+40)continue;
    const p = 0.4+0.6*Math.sin(time*1.8+d.ph);
    ctx.globalAlpha = 0.15+0.65*p;
    ctx.drawImage(d.sprite,rx-d.spriteR,ry-d.spriteR);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalCompositeOperation = 'lighter';
  for(const p of PORTALS){
    const dx = wrapDelta(p.x,cam.x),dy = wrapDelta(p.y,cam.y);
    const rx = cam.x+dx,ry = cam.y+dy;
    if(rx<camLeft-100||rx>camRight+100||ry<camTop-100||ry>camBottom+100)continue;
    const pulse = 0.5+0.5*Math.sin(time*2.2+(p.id||0)*1.3);
    const glowR = (p.radius||38)*(1.6+pulse*0.35);
    const g = ctx.createRadialGradient(rx,ry,3,rx,ry,glowR);
    g.addColorStop(0,'hsla('+p.hue+',90%,72%,'+(0.75+pulse*0.2)+')');
    g.addColorStop(0.5,'hsla('+p.hue+',85%,55%,'+(0.35+pulse*0.2)+')');
    g.addColorStop(1,'hsla('+p.hue+',85%,45%,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(rx,ry,glowR,0,TAU); ctx.fill();
    ctx.strokeStyle = 'hsla('+p.hue+',90%,75%,'+(0.65+pulse*0.3)+')';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(rx,ry,(p.radius||38)*0.85,0,TAU); ctx.stroke();
    ctx.strokeStyle = 'hsla('+p.hue+',90%,85%,'+(0.5+pulse*0.4)+')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(rx,ry,(p.radius||38)*0.55,0,TAU); ctx.stroke();
    const rot = time*1.2+(p.id||0);
    for(let k=0;k<4;k++){
      const a = rot+k*Math.PI/2;
      const x1 = rx+Math.cos(a)*(p.radius||38)*0.55;
      const y1 = ry+Math.sin(a)*(p.radius||38)*0.55;
      const x2 = rx+Math.cos(a)*(p.radius||38)*1.05;
      const y2 = ry+Math.sin(a)*(p.radius||38)*1.05;
      ctx.strokeStyle = 'hsla('+p.hue+',90%,80%,'+(0.35+pulse*0.3)+')';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
    ctx.fillStyle = 'hsla('+p.hue+',95%,88%,'+(0.8+pulse*0.2)+')';
    ctx.beginPath(); ctx.arc(rx,ry,3+pulse*1.5,0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  for(const o of obstacles){
    const dx = wrapDelta(o.x,cam.x),dy = wrapDelta(o.y,cam.y);
    const rx = cam.x+dx,ry = cam.y+dy;
    if(rx<camLeft-120||rx>camRight+120||ry<camTop-120||ry>camBottom+120)continue;
    drawRock({x:rx,y:ry,r:o.r,pts:o.pts,rot:o.rot||0});
  }
  ctx.globalCompositeOperation = 'lighter';
  for(const p of particles){
    const a = p.life/p.max;
    ctx.fillStyle = 'hsla('+p.hue+',95%,65%,'+(a*0.9)+')';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a+0.5,0,TAU); ctx.fill();
  }
  for(const r of rings){
    const a = r.life/r.maxLife;
    ctx.strokeStyle = 'hsla('+r.hue+',95%,72%,'+a+')';
    ctx.lineWidth = 3.5*a;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,TAU); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  for(const [,e] of NET.remoteEnemies){
    if(!e.curr)continue;
    const dx = wrapDelta(e.x,cam.x),dy = wrapDelta(e.y,cam.y);
    const rx = cam.x+dx,ry = cam.y+dy;
    if(rx<camLeft-300||rx>camRight+300||ry<camTop-300||ry>camBottom+300)continue;
    if(!isFiniteNum(rx)||!isFiniteNum(ry))continue;
    try{
      drawMonsterView({
        ty:e.curr.ty,x:rx,y:ry,
        angle:isFiniteNum(e.angle)?e.angle:0,
        h:e.curr.h||200,
        sa:e.curr.sa||0,wp:e.curr.wp||0,wb:e.curr.wb||0
      });
    }catch(err){}
  }
  const drawArrowAt = (rx,ry,angle,hue)=>{
    ctx.save();
    ctx.translate(rx,ry);
    ctx.rotate(angle||0);
    ctx.globalCompositeOperation = 'lighter';
    const grad = ctx.createLinearGradient(-30,0,10,0);
    grad.addColorStop(0,'hsla('+(hue||205)+',90%,60%,0)');
    grad.addColorStop(1,'hsla('+(hue||205)+',90%,70%,0.8)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.moveTo(-30,-3); ctx.lineTo(-30,3); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(220,235,255,0.95)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(10,0); ctx.stroke();
    ctx.fillStyle = '#e0f0ff';
    ctx.beginPath(); ctx.moveTo(8,-4); ctx.lineTo(18,0); ctx.lineTo(8,4); ctx.closePath(); ctx.fill();
    ctx.restore();
  };
  for(const a of localArrows){
    const dx = wrapDelta(a.x,cam.x),dy = wrapDelta(a.y,cam.y);
    const rx = cam.x+dx,ry = cam.y+dy;
    if(rx<camLeft-100||rx>camRight+100||ry<camTop-100||ry>camBottom+100)continue;
    drawArrowAt(rx,ry,a.angle,a.hue);
  }
  for(const [,a] of NET.remoteArrows){
    if(a.curr.ownerId===NET.myId)continue;
    const dx = wrapDelta(a.x,cam.x),dy = wrapDelta(a.y,cam.y);
    const rx = cam.x+dx,ry = cam.y+dy;
    if(rx<camLeft-100||rx>camRight+100||ry<camTop-100||ry>camBottom+100)continue;
    drawArrowAt(rx,ry,a.angle,a.curr.h);
  }
  for(const [,w] of NET.remoteWaves){
    const c = w.curr;
    const dx = wrapDelta(w.x,cam.x),dy = wrapDelta(w.y,cam.y);
    const rx = cam.x+dx,ry = cam.y+dy;
    if(rx<camLeft-100||rx>camRight+100||ry<camTop-100||ry>camBottom+100)continue;
    const t = c.l/Math.max(0.001,c.ml);
    const a = (1-t)*0.85;
    ctx.save();
    ctx.translate(rx,ry);
    ctx.rotate(w.angle);
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(-30,0,30,0);
    g.addColorStop(0,'hsla('+c.h+',90%,65%,0)');
    g.addColorStop(0.5,'hsla('+c.h+',95%,75%,'+a+')');
    g.addColorStop(1,'hsla('+c.h+',90%,85%,'+(a*0.5)+')');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0,0,38,18,0,0,TAU);
    ctx.fill();
    ctx.restore();
  }
  for(const [,rp] of NET.remotePlayers){
    const c = rp.curr;
    if(!c.al)continue;
    const dx = wrapDelta(rp.x,cam.x),dy = wrapDelta(rp.y,cam.y);
    const rx = cam.x+dx,ry = cam.y+dy;
    if(rx<camLeft-200||rx>camRight+200||ry<camTop-200||ry>camBottom+200)continue;
    const attacking = c.sw===1;
    const prog = attacking?clamp(1-Math.max(0,(performance.now()-NET.lastSnapAt)/160),0,1):0;
    drawWarrior(rx,ry,rp.angle||0,c.wp||0,attacking,prog,
      (c.h!=null?c.h:205),c.lv||1,c.c);
    ctx.save();
    ctx.font = 'bold 11px Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,0.75)';
    ctx.lineWidth = 3;
    ctx.strokeText(c.n||'?',rx,ry-30);
    ctx.fillStyle = 'hsla('+(c.h||205)+',90%,80%,0.95)';
    ctx.fillText(c.n||'?',rx,ry-30);
    if(typeof c.hp==='number'&&typeof c.mhp==='number'&&c.hp<c.mhp){
      const bw = 30,bh = 3;
      const bx = rx-bw/2,by = ry-24;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(bx,by,bw,bh);
      const pct = clamp(c.hp/c.mhp,0,1);
      ctx.fillStyle = pct>0.5?'#6dff8c':pct>0.25?'#ffd76a':'#ff5a5a';
      ctx.fillRect(bx,by,bw*pct,bh);
    }
    ctx.restore();
  }
  if(player.alive&&isFiniteNum(player.x)&&isFiniteNum(player.y)){
    const prx = cam.x+wrapDelta(player.x,cam.x);
    const pry = cam.y+wrapDelta(player.y,cam.y);
    const attacking = player.swing>0;
    const prog = attacking?1-player.swing/0.16:0;
    drawWarrior(prx,pry,player.angle,player.walkPhase,
      attacking,prog,player.hue,player.level,player.charId);
    if(player.spawnProt>0){
      ctx.save();
      ctx.translate(prx,pry);
      ctx.strokeStyle = 'rgba(140,220,255,'+(0.35+0.4*Math.sin(time*18))+')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0,0,26,0,TAU); ctx.stroke();
      ctx.restore();
    }
    /* ✅ v14.4 — نمایش بصری ضربه/بلوک (blockFlash) */
    if(player.blockFlash > 0.05){
      ctx.save();
      ctx.translate(prx,pry);
      ctx.globalCompositeOperation = 'lighter';
      const a = clamp(player.blockFlash,0,1);
      const r = 30 + (1-a)*8;
      const g = ctx.createRadialGradient(0,0,10,0,0,r);
      g.addColorStop(0,'rgba(255,140,140,0)');
      g.addColorStop(0.55,'rgba(255,140,140,'+(a*0.55)+')');
      g.addColorStop(1,'rgba(255,80,80,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,180,180,'+(a*0.9)+')';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
    }
    if(player.charId==='tank'){
      ctx.save();
      ctx.translate(prx,pry);
      ctx.globalCompositeOperation = 'lighter';
      const charge = player.shieldCharge;
      const rot = time*1.6;
      for(let i=0;i<4;i++){
        const a = rot+i*Math.PI/2;
        ctx.fillStyle = 'hsla('+player.hue+',90%,'+(55+charge*25)+'%,'+(0.35+charge*0.55)+')';
        ctx.beginPath(); ctx.arc(Math.cos(a)*30,Math.sin(a)*30,3.5+charge*3,0,TAU); ctx.fill();
      }
      ctx.strokeStyle = 'hsla('+player.hue+',90%,70%,'+(0.12+charge*0.35)+')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0,0,30,0,TAU); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
    }
    if(attacking&&player.charId!=='archer'){
      const alpha = player.swing/0.16;
      const rr = CFG.swordRange*(CHARACTERS[player.charId].range||1);
      ctx.save();
      ctx.translate(prx,pry);
      ctx.rotate(player.swingDir);
      ctx.globalCompositeOperation = 'lighter';
      const arcRange = (player.charId==='warrior'&&player.level>=5)?Math.PI:CFG.swordArc;
      ctx.beginPath();
      ctx.arc(0,0,rr*0.92,-arcRange,arcRange);
      ctx.strokeStyle = 'rgba(180,230,255,'+(alpha*0.65)+')';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.shadowBlur = 22;
      ctx.shadowColor = 'rgba(120,200,255,1)';
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  for(const [,e] of NET.remoteEnemies){
    const c = e.curr;
    if(!c||!c.hp||!c.mhp||c.mhp<=1||c.hp>=c.mhp)continue;
    const dx = wrapDelta(e.x,cam.x),dy = wrapDelta(e.y,cam.y);
    const wx = cam.x+dx,wy = cam.y+dy;
    const t = MONSTER_TYPES[c.ty];
    if(!t)continue;
    const barW = t.radius*1.6;
    const barH = 3;
    const pct2 = clamp(c.hp/c.mhp,0,1);
    const bx = wx-barW/2;
    const by = wy-t.radius-10;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(bx,by,barW,barH);
    ctx.fillStyle = pct2>0.5?'#6dff8c':pct2>0.25?'#ffd76a':'#ff5a5a';
    ctx.fillRect(bx,by,barW*pct2,barH);
  }
  if(window.FX){try{FX.draw(ctx)}catch(e){}}
  ctx.restore();
  const vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.34,W/2,H/2,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.62)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);
  if(screenFlash>0){
    ctx.fillStyle = 'rgba(255,225,150,'+(screenFlash*0.28)+')';
    ctx.fillRect(0,0,W,H);
  }
  drawJoystick();
  updateActionButtonsVisual();
  drawMinimap();
  if(!player.alive&&gameActive){
    const a = 0.5+0.5*Math.sin(time*3);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold clamp(26px,5.5vw,40px) Tahoma, sans-serif';
    ctx.fillStyle = 'rgba(255,90,90,'+(0.72+0.24*a)+')';
    ctx.shadowBlur = 30;
    ctx.shadowColor = 'rgba(255,60,60,0.9)';
    ctx.fillText('شما نابود شدید',W/2,H/2-40);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 17px Tahoma, sans-serif';
    ctx.fillStyle = 'rgba(200,220,255,0.85)';
    ctx.fillText('بازگشت تا '+faNumF(player.respawn,1)+' ثانیه',W/2,H/2+14);
    ctx.font = 'bold 13px Tahoma, sans-serif';
    ctx.fillStyle = 'rgba(255,180,180,0.9)';
    ctx.fillText('تمام سطح و ویژگی‌ها از دست می‌رود',W/2,H/2+42);
    ctx.restore();
  }
}

function drawJoystick(){
  const joyDemo = document.getElementById('joyDemo');
  const joyKnob = document.getElementById('joyKnob');
  if(!joyDemo||!joyKnob)return;
  if(!joy.active){
    joyDemo.style.left = (joy.restX-joy.radius)+'px';
    joyDemo.style.top = (joy.restY-joy.radius)+'px';
    joyKnob.style.transform = 'translate(-50%,-50%)';
  } else {
    joyDemo.style.left = (joy.baseX-joy.radius)+'px';
    joyDemo.style.top = (joy.baseY-joy.radius)+'px';
    const dx = joy.displayX-joy.baseX;
    const dy = joy.displayY-joy.baseY;
    joyKnob.style.transform = 'translate(-50%,-50%) translate('+dx+'px,'+dy+'px)';
  }
}

const _uiCache = {atkOp:null, dashOp:null, dashRingOn:null, dashBg:null};

function updateActionButtonsVisual(){
  const atkBtn = document.getElementById('btnAttack');
  const dashBtn = document.getElementById('btnDash');
  const dashRing = document.getElementById('dashCdRing');
  if(atkBtn){
    const ready = player.atkCd<=0;
    const op = ready?'1':'0.6';
    if(_uiCache.atkOp !== op){
      atkBtn.style.opacity = op;
      _uiCache.atkOp = op;
    }
  }
  if(dashBtn&&dashRing){
    const now = performance.now();
    const remain = Math.max(player.dashCd>0?player.dashCd:0,(_dashCooldownLocal-now)/1000);
    const total = pDashCdClient(player.charId,player.level);
    if(remain>0.05){
      if(_uiCache.dashOp !== '0.55'){dashBtn.style.opacity = '0.55'; _uiCache.dashOp = '0.55'}
      if(!_uiCache.dashRingOn){dashRing.classList.add('on'); _uiCache.dashRingOn = true}
      const ratio = clamp(1-remain/total,0,1);
      const bg = 'conic-gradient(rgba(200,235,255,.85) '+(ratio*360).toFixed(1)+'deg, transparent '+(ratio*360).toFixed(1)+'deg)';
      const roundedRatio = Math.round(ratio*100);
      if(_uiCache.dashBg !== roundedRatio){
        dashRing.style.background = bg;
        _uiCache.dashBg = roundedRatio;
      }
    } else {
      if(_uiCache.dashOp !== '1'){dashBtn.style.opacity = '1'; _uiCache.dashOp = '1'}
      if(_uiCache.dashRingOn){dashRing.classList.remove('on'); _uiCache.dashRingOn = false; _uiCache.dashBg = null}
    }
  }
}

let _startingGame = false;

async function startGame(){
  if(_startingGame||gameActive)return;
  _startingGame = true;
  try{
    initAudio();
    if(actx&&actx.state==='suspended')actx.resume();
    resetInput();
    NET.remotePlayers.clear();
    NET.remoteEnemies.clear();
    NET.remoteArrows.clear();
    NET.remoteWaves.clear();
    NET.leaderboard = [];
    particles.length = 0;
    rings.length = 0;
    localArrows.length = 0;
    pendingInputs.length = 0;
    inputSeq = 0;
    if(chatStage)chatStage.innerHTML = '';
    if(window.FX)try{FX.clear()}catch(e){}
    const nm = ((nameInput&&nameInput.value)||'').trim()||'بازیکن';
    playBtn.disabled = true;
    playBtn.textContent = 'در حال شروع…';
    connMsg.textContent = '';
    NET._intentionalClose = false;
    NET._reconnectAttempts = 0;
    cancelReconnect();
    try{
      if(selectedMode==='offline'){
        WSZ = CFG.worldSize;
        startOfflineMode(nm,selectedChar,selectedTeam,selectedColor);
      } else {
        if(NET.offline){
          NET.offline = false;
          if(NET.local){NET.local.stop(); NET.local = null}
        }
        const url = ((serverInput&&serverInput.value)||'').trim();
        if(!url)throw new Error('نشانی سرور را وارد کنید');
        await connectToServer(url,nm,selectedChar,selectedTeam,selectedColor);
      }
    }catch(e){
      playBtn.disabled = false;
      playBtn.textContent = 'شروع بازی';
      connMsg.textContent = e.message||e;
      return;
    }
    player.name = nm;
    player.charId = selectedChar;
    player.char = CHARACTERS[selectedChar];
    const parsedHue = parseInt(selectedColor,10);
    player.hue = (selectedColor!=='auto' && isFiniteNum(parsedHue) && PALETTE.includes(parsedHue))
      ? parsedHue
      : (selectedTeam!=='ffa' ? TEAMS[selectedTeam].hue : CHARACTERS[selectedChar].hue);
    player.team = selectedTeam;
    player.kills = 0;
    player.deaths = 0;
    player.level = 1;
    player.xp = 0;
    player.xpNeed = xpForLevel(1);
    player.atkCd = 0;
    player.swing = 0;
    player.dashCd = 0;
    player.dashTime = 0;
    player.walkPhase = 0;
    player._dashLockUntil = 0;
    player._auraNext = 0;
    player.shieldCharge = CHARACTERS[selectedChar].shield?1:0;
    player.maxHp = pMaxHpClient(1,selectedChar);
    player.hp = player.maxHp;
    player.damage = pDamageClient(1);
    player.correctX = 0;
    player.correctY = 0;
    player.alive = true;
    player.blockFlash = 0;
    player.spawnProt = CFG.initialProt;
    _dashCooldownLocal = 0;
    applyCharUI(selectedChar);
    menuEl.classList.add('hide');
    setTimeout(()=>{menuEl.style.display = 'none'},560);
    hudEl.classList.remove('off');
    statBarEl.classList.remove('off');
    document.getElementById('disconnectOverlay').classList.remove('on');
    gameActive = true;
    playBtn.disabled = false;
    playBtn.textContent = 'شروع بازی';
    const discBtn = document.getElementById('discReconnectBtn');
    if(discBtn&&!discBtn._wired){
      discBtn._wired = true;
      discBtn.addEventListener('click',()=>{
        if(!NET._reconnectInfo)return;
        cancelReconnect();
        NET._reconnectAttempts = 0;
        NET._intentionalClose = false;
        document.getElementById('discStatus').textContent = 'در حال اتصال…';
        const info = NET._reconnectInfo;
        connectToServer(info.url,info.name,info.charId,info.team,info.color)
          .then(()=>{NET._reconnectAttempts = 0})
          .catch(()=>scheduleReconnect());
      });
    }
    const discCancelBtn = document.getElementById('discCancelBtn');
    if(discCancelBtn&&!discCancelBtn._wired){
      discCancelBtn._wired = true;
      discCancelBtn.addEventListener('click',()=>{
        NET._intentionalClose = true;
        cancelReconnect();
        if(NET.ws){try{NET.ws.close(1000,'user_cancel')}catch(e){}}
        NET.connected = false;
        NET._reconnectInfo = null;
        document.getElementById('disconnectOverlay').classList.remove('on');
        gameActive = false;
        hudEl.classList.add('off');
        statBarEl.classList.add('off');
        menuEl.style.display = 'flex';
        menuEl.classList.remove('hide');
        requestAnimationFrame(()=>menuEl.classList.remove('hide'));
        setConnBadge('','آفلاین');
        if(NET.local){NET.local.stop(); NET.local = null}
        NET.offline = false;
      });
    }
  } finally {
    _startingGame = false;
  }
}
function startOfflineMode(name,charId,team,color){
  NET.offline = true;
  NET.connected = true;
  setConnBadge('ok','تنها');
  if(NET.local)NET.local.stop();
  NET.local = createLocalServer(name,charId,team,color);
  NET.local.onMessage = handleServerMessage;
  handleServerMessage({
    t:'welcome',id:NET.local.player.id,worldSize:WSZ,
    obstacles:NET.local.obstacles,
    portals:NET.local.portals.map(p=>({id:p.id,x:p.x,y:p.y,hue:p.hue,radius:p.radius})),
    x:NET.local.player.x,y:NET.local.player.y,
    team:NET.local.player.team,hue:NET.local.player.hue,
    chatHistory:[]
  });
  NET.local.start();
}

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(typeof r==='number')r = [r,r,r,r];
    this.moveTo(x+r[0],y);
    this.lineTo(x+w-r[1],y);
    this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
    this.lineTo(x+w,y+h-r[2]);
    this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
    this.lineTo(x+r[3],y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
    this.lineTo(x,y+r[0]);
    this.quadraticCurveTo(x,y,x+r[0],y);
    this.closePath();
    return this;
  };
}

/* ═══ حلقه‌ی اصلی ═══ */
let last = performance.now();
let _loopErrorCount = 0;
let _lastErrTime = 0;

function loop(now){
  let dt = (now-last)/1000;
  last = now;
  if(dt>0.05)dt = 0.05;
  if(dt<0)dt = 0;

  if(_loopErrorCount>0&&now-_lastErrTime>5000)_loopErrorCount = 0;

  if(gameActive){
    try{update(dt)}
    catch(e){
      _loopErrorCount++;
      _lastErrTime = now;
      if(_loopErrorCount<5)console.error('[به‌روزرسانی]',e.message);
      if(!isFiniteNum(player.x))player.x = WSZ/2;
      if(!isFiniteNum(player.y))player.y = WSZ/2;
      if(!isFiniteNum(cam.x))cam.x = WSZ/2;
      if(!isFiniteNum(cam.y))cam.y = WSZ/2;
      if(!isFiniteNum(player.angle))player.angle = 0;
      if(!isFiniteNum(player.atkCd))player.atkCd = 0;
      if(!isFiniteNum(player.swing))player.swing = 0;
      if(!isFiniteNum(player.dashCd))player.dashCd = 0;
      if(!isFiniteNum(player.dashTime))player.dashTime = 0;
      if(!isFiniteNum(player.spawnProt))player.spawnProt = 0;
      if(!isFiniteNum(player.respawn))player.respawn = 0;
    }

    try{render()}
    catch(e){
      _loopErrorCount++;
      _lastErrTime = now;
      if(_loopErrorCount<5)console.error('[رسم]',e.message);
    } finally {
      try{
        for(let i=0;i<12;i++)ctx.restore();
      }catch(e){}
      ctx.setTransform(DPR,0,0,DPR,0,0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  } else {
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0,0,W,H);
    const bg = ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,Math.max(W,H)*0.8);
    bg.addColorStop(0,'#0d1729');
    bg.addColorStop(1,'#04060c');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);
  }
  hudTimer -= dt;
  if(hudTimer<=0){
    hudTimer = 0.2;
    if(gameActive){try{updateHUD()}catch(e){}}
  }
  requestAnimationFrame(loop);
}

/* ═══ آغاز ═══ */
renderCharCards();
renderTeams();
renderColors();
renderModes();
applyCharUI(selectedChar);
resize();
setupMinimap();
requestAnimationFrame(loop);

})();
</script>
