function movePlayerLocal(dt){
  if(!player.alive){ dashQueued = false; return; }
  if(!NET.offline && !NET.connected){
    player.vx = 0; player.vy = 0;
    dashQueued = false;
    return;
  }
  let ix = joy.outX, iy = joy.outY;
  let kx=0, ky=0;
  if(key['KeyW']||key['ArrowUp'])    ky--;
  if(key['KeyS']||key['ArrowDown'])  ky++;
  if(key['KeyA']||key['ArrowLeft'])  kx--;
  if(key['KeyD']||key['ArrowRight']) kx++;
  const km = Math.hypot(kx, ky);
  if(km > 0){ kx /= km; ky /= km; ix = kx; iy = ky; }
  const moving = Math.hypot(ix, iy) > 0.02;

  let targetAngle = player.angle;
  if(hasFinePointer && input.aimActive){
    const s = viewScale();
    const wx = (input.aimX - W/2)/s + cam.x;
    const wy = (input.aimY - H/2)/s + cam.y;
    const adx = wrapDelta(wx, player.x);
    const ady = wrapDelta(wy, player.y);
    targetAngle = Math.atan2(ady, adx);
  } else {
    let bestA = null, bestD = 1e9;
    for(const [, e] of NET.remoteEnemies){
      const dx = wrapDelta(e.x, player.x), dy = wrapDelta(e.y, player.y);
      const d = Math.hypot(dx, dy);
      if(d < bestD && d < 380){ bestD = d; bestA = Math.atan2(dy, dx); }
    }
    if(bestA !== null) targetAngle = bestA;
    else if(moving) targetAngle = Math.atan2(iy, ix);
  }
  if(!isFinite(targetAngle)) targetAngle = player.angle;
  player.angle = normAng(player.angle + angDiff(targetAngle, player.angle) * Math.min(1, dt*15));
  if(!isFinite(player.angle)) player.angle = 0;

  if(dashQueued){
    dashQueued = false;
    if(player.dashCd <= 0 && player.dashTime <= 0){
      sendToServer({ t:'in', mx: ix, my: iy, aim: player.angle, atk: false, atkHeld: false, dash: true });
      // ✅ اعمال ضریب شخصیت در کول‌داون جهش کلاینت
      player.dashCd = pDashCdClient(player.charId);
      player.dashTime = CFG.dashDur;
      player.dashDir = moving ? Math.atan2(iy, ix) : player.angle;
      player._dashLockUntil = performance.now() + 1500;
      SFX.dash();
      for(let i=0;i<12;i++) addParticle(player.x, player.y, player.hue, 0.4, 0.6, 3);
    }
  }
  const spd = CFG.playerSpeed * (CHARACTERS[player.charId].speed || 1);
  if(player.dashTime > 0){
    player.dashTime -= dt;
    const moveD = CFG.dashSpeed * (CHARACTERS[player.charId].dash || 1) * dt;
    const steps = Math.max(1, Math.ceil(moveD / 15));
    for(let s=0; s<steps; s++){
      player.x = wrap(player.x + Math.cos(player.dashDir)*moveD/steps);
      player.y = wrap(player.y + Math.sin(player.dashDir)*moveD/steps);
      collideObstaclesClient(player, 16);
      collidePortalsClient(player, 16);
    }
    player.walkPhase += dt*20;
  } else {
    const k = 1 - Math.pow(0.0000018, dt);
    player.vx = lerp(player.vx, ix*spd, k);
    player.vy = lerp(player.vy, iy*spd, k);
    const vx = player.vx * dt, vy = player.vy * dt;
    const mlen = Math.hypot(vx, vy);
    const steps = Math.max(1, Math.ceil(mlen / 15));
    for(let s=0; s<steps; s++){
      player.x = wrap(player.x + vx/steps);
      player.y = wrap(player.y + vy/steps);
      collideObstaclesClient(player, 16);
      collidePortalsClient(player, 16);
    }
    player.walkPhase += moving ? dt*11 : dt*2.5;
  }
  if(!isFinite(player.x) || !isFinite(player.y)){
    player.x = WSZ/2; player.y = WSZ/2;
    player.vx = 0; player.vy = 0;
    cam.x = player.x; cam.y = player.y;
  }
}

function updateLocalArrows(dt){
  for(let i = localArrows.length - 1; i >= 0; i--){
    const a = localArrows[i];
    a.x = wrap(a.x + a.vx * dt); a.y = wrap(a.y + a.vy * dt);
    a.life -= dt;
    let hit = false;
    for(const [, e] of NET.remoteEnemies){
      const t = MONSTER_TYPES[e.curr && e.curr.ty]; if(!t) continue;
      if(Math.hypot(wrapDelta(e.x, a.x), wrapDelta(e.y, a.y)) < t.radius + 6){ hit = true; break; }
    }
    if(!hit){
      for(const o of obstacles){
        if(Math.hypot(wrapDelta(o.x, a.x), wrapDelta(o.y, a.y)) < o.r * 0.82){ hit = true; break; }
      }
    }
    if(hit || a.life <= 0) localArrows.splice(i, 1);
  }
}

let lastInputSent = 0;
function sendInput(){
  const now = performance.now();
  if(now - lastInputSent < 33) return;
  lastInputSent = now;
  let ix = joy.outX, iy = joy.outY;
  let kx=0, ky=0;
  if(key['KeyW']||key['ArrowUp'])    ky--;
  if(key['KeyS']||key['ArrowDown'])  ky++;
  if(key['KeyA']||key['ArrowLeft'])  kx--;
  if(key['KeyD']||key['ArrowRight']) kx++;
  const km = Math.hypot(kx, ky);
  if(km > 0){ ix = kx/km; iy = ky/km; }
  const wantAtk = attackQueued || (input.attack && player.atkCd <= 0);
  sendToServer({ t:'in', mx: ix, my: iy, aim: player.angle,
    atk: wantAtk, atkHeld: input.attack, dash: false });
  if(wantAtk){
    player.atkCd = CFG.swordCd * (CHARACTERS[player.charId].cd || 1);
    player.swing = 0.16;
    player.swingDir = player.angle;
    if(player.charId === 'archer'){
      SFX.bow();
      localArrows.push({
        id: 'local_' + Math.random(), ownerId: NET.myId,
        x: wrap(player.x + Math.cos(player.angle)*22), y: wrap(player.y + Math.sin(player.angle)*22),
        vx: Math.cos(player.angle) * CFG.arrowSpeed, vy: Math.sin(player.angle) * CFG.arrowSpeed,
        angle: player.angle, life: 1.5, hue: player.hue
      });
    } else SFX.swing();
  }
  attackQueued = false;
}

function update(dt){
  time += dt;
  screenFlash = Math.max(0, screenFlash - dt*1.6);
  player.blockFlash = Math.max(0, player.blockFlash - dt*1.8);

  const smoothK = 1 - Math.pow(0.00004, dt);
  joy.outX = lerp(joy.outX, joy.targetX, smoothK);
  joy.outY = lerp(joy.outY, joy.targetY, smoothK);
  joy.displayX = lerp(joy.displayX, joy.knobX, 1 - Math.pow(0.0005, dt));
  joy.displayY = lerp(joy.displayY, joy.knobY, 1 - Math.pow(0.0005, dt));

  player.atkCd = Math.max(-1, player.atkCd - dt);
  player.swing = Math.max(-1, player.swing - dt);
  player.dashCd = Math.max(-1, player.dashCd - dt);
  player.spawnProt = Math.max(-1, player.spawnProt - dt);
  if(!player.alive) player.respawn = Math.max(0, player.respawn - dt);

  if(player.alive) movePlayerLocal(dt);
  sendInput();

  interpMap(NET.remotePlayers, dt);
  interpMap(NET.remoteEnemies, dt);
  interpMap(NET.remoteArrows, dt);
  updateLocalArrows(dt);
  updateParticles(dt);

  if(!isFinite(cam.x) || !isFinite(cam.y) || !isFinite(player.x) || !isFinite(player.y)){
    cam.x = player.x; cam.y = player.y;
  }
  const camDx = wrapDelta(player.x, cam.x);
  const camDy = wrapDelta(player.y, cam.y);
  const followK = 1 - Math.pow(0.0009, dt);
  cam.x += camDx * followK; cam.y += camDy * followK;
  cam.x = wrap(cam.x); cam.y = wrap(cam.y);
  if(!isFinite(cam.x)) cam.x = player.x;
  if(!isFinite(cam.y)) cam.y = player.y;

  shake *= Math.pow(0.02, dt);
  if(shake < 0.3) shake = 0;
}

/* ============ RENDER ============ */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  const bg = ctx.createRadialGradient(W/2,H/2,60, W/2,H/2,Math.max(W,H)*0.8);
  bg.addColorStop(0,'#0d1729'); bg.addColorStop(1,'#04060c');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  const s = viewScale();
  const sx = (Math.random()-0.5)*shake;
  const sy = (Math.random()-0.5)*shake;
  const halfW = W/(2*s), halfH = H/(2*s);
  const camLeft = cam.x - halfW, camRight = cam.x + halfW;
  const camTop = cam.y - halfH, camBottom = cam.y + halfH;

  ctx.save();
  ctx.translate(W/2 + sx, H/2 + sy);
  ctx.scale(s, s);
  ctx.translate(-cam.x, -cam.y);

  ctx.fillStyle = '#080d18';
  ctx.fillRect(camLeft, camTop, camRight-camLeft, camBottom-camTop);

  ctx.globalCompositeOperation = 'lighter';
  const aglow = ctx.createRadialGradient(cam.x, cam.y, 60, cam.x, cam.y, Math.max(halfW, halfH)*1.6);
  aglow.addColorStop(0, 'rgba(50,110,200,0.10)');
  aglow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = aglow;
  ctx.fillRect(camLeft, camTop, camRight-camLeft, camBottom-camTop);
  ctx.globalCompositeOperation = 'source-over';

  const step = 100;
  ctx.strokeStyle = 'rgba(120,180,255,0.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const firstXIdx = Math.floor(camLeft/step), lastXIdx = Math.ceil(camRight/step);
  for(let i = firstXIdx; i <= lastXIdx; i++){ ctx.moveTo(i*step, camTop); ctx.lineTo(i*step, camBottom); }
  const firstYIdx = Math.floor(camTop/step), lastYIdx = Math.ceil(camBottom/step);
  for(let j = firstYIdx; j <= lastYIdx; j++){ ctx.moveTo(camLeft, j*step); ctx.lineTo(camRight, j*step); }
  ctx.stroke();

  ctx.globalCompositeOperation = 'lighter';
  for(const d of decors){
    const dx = wrapDelta(d.x, cam.x), dy = wrapDelta(d.y, cam.y);
    const rx = cam.x + dx, ry = cam.y + dy;
    if(rx < camLeft-20 || rx > camRight+20 || ry < camTop-20 || ry > camBottom+20) continue;
    const p = 0.4 + 0.6*Math.sin(time*1.8 + d.ph);
    ctx.fillStyle = 'hsla('+d.hue+',90%,68%,'+(0.13*p)+')';
    ctx.beginPath(); ctx.arc(rx, ry, d.r*3.2, 0, TAU); ctx.fill();
    ctx.fillStyle = 'hsla('+d.hue+',95%,80%,'+(0.5*p)+')';
    ctx.beginPath(); ctx.arc(rx, ry, d.r, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  ctx.globalCompositeOperation = 'lighter';
  for(const p of PORTALS){
    const dx = wrapDelta(p.x, cam.x), dy = wrapDelta(p.y, cam.y);
    const rx = cam.x + dx, ry = cam.y + dy;
    if(rx < camLeft-100 || rx > camRight+100 || ry < camTop-100 || ry > camBottom+100) continue;
    const pulse = 0.5 + 0.5 * Math.sin(time * 2.2 + (p.id || 0) * 1.3);
    const glowR = (p.radius || 38) * (1.6 + pulse * 0.35);
    const g = ctx.createRadialGradient(rx, ry, 3, rx, ry, glowR);
    g.addColorStop(0, 'hsla(' + p.hue + ',90%,72%,' + (0.75 + pulse * 0.2) + ')');
    g.addColorStop(0.5, 'hsla(' + p.hue + ',85%,55%,' + (0.35 + pulse * 0.2) + ')');
    g.addColorStop(1, 'hsla(' + p.hue + ',85%,45%,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(rx, ry, glowR, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'hsla(' + p.hue + ',90%,75%,' + (0.65 + pulse * 0.3) + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(rx, ry, (p.radius || 38) * 0.85, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'hsla(' + p.hue + ',90%,85%,' + (0.5 + pulse * 0.4) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(rx, ry, (p.radius || 38) * 0.55, 0, TAU); ctx.stroke();
    const rot = time * 1.2 + (p.id || 0);
    for (let k = 0; k < 4; k++) {
      const a = rot + k * Math.PI / 2;
      const x1 = rx + Math.cos(a) * (p.radius || 38) * 0.55;
      const y1 = ry + Math.sin(a) * (p.radius || 38) * 0.55;
      const x2 = rx + Math.cos(a) * (p.radius || 38) * 1.05;
      const y2 = ry + Math.sin(a) * (p.radius || 38) * 1.05;
      ctx.strokeStyle = 'hsla(' + p.hue + ',90%,80%,' + (0.35 + pulse * 0.3) + ')';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    ctx.fillStyle = 'hsla(' + p.hue + ',95%,88%,' + (0.8 + pulse * 0.2) + ')';
    ctx.beginPath(); ctx.arc(rx, ry, 3 + pulse * 1.5, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  for(const o of obstacles){
    const dx = wrapDelta(o.x, cam.x), dy = wrapDelta(o.y, cam.y);
    const rx = cam.x + dx, ry = cam.y + dy;
    if(rx < camLeft-120 || rx > camRight+120 || ry < camTop-120 || ry > camBottom+120) continue;
    drawRock({ x: rx, y: ry, r: o.r, pts: o.pts, rot: o.rot });
  }

  ctx.globalCompositeOperation = 'lighter';
  for(const p of particles){
    const a = p.life/p.max;
    ctx.fillStyle = 'hsla('+p.hue+',95%,65%,'+(a*0.9)+')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*a + 0.5, 0, TAU); ctx.fill();
  }
  for(const r of rings){
    const a = r.life/r.maxLife;
    ctx.strokeStyle = 'hsla('+r.hue+',95%,72%,'+a+')';
    ctx.lineWidth = 3.5*a;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  for(const [, e] of NET.remoteEnemies){
    if(!e.curr) continue;
    const dx = wrapDelta(e.x, cam.x), dy = wrapDelta(e.y, cam.y);
    const rx = cam.x + dx, ry = cam.y + dy;
    if(rx < camLeft-300 || rx > camRight+300 || ry < camTop-300 || ry > camBottom+300) continue;
    if(!isFinite(rx) || !isFinite(ry)) continue;
    try {
      drawMonsterView({ ty: e.curr.ty, x: rx, y: ry,
        angle: (e.angle|0) || 0, h: e.curr.h || 200,
        sa: e.curr.sa || 0, wp: e.curr.wp || 0, wb: e.curr.wb || 0 });
    } catch(err){
      ctx.save();
      ctx.fillStyle = 'hsl(' + (e.curr.h || 200) + ',85%,60%)';
      ctx.beginPath();
      ctx.arc(rx, ry, 14, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  const drawArrowAt = (rx, ry, angle, hue) => {
    ctx.save();
    ctx.translate(rx, ry);
    ctx.rotate(angle || 0);
    ctx.globalCompositeOperation = 'lighter';
    const grad = ctx.createLinearGradient(-30, 0, 10, 0);
    grad.addColorStop(0, 'hsla(' + (hue||205) + ',90%,60%,0)');
    grad.addColorStop(1, 'hsla(' + (hue||205) + ',90%,70%,0.8)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.moveTo(-30,-3); ctx.lineTo(-30,3); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(220,235,255,0.95)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(10, 0); ctx.stroke();
    ctx.fillStyle = '#e0f0ff';
    ctx.beginPath(); ctx.moveTo(8,-4); ctx.lineTo(18,0); ctx.lineTo(8,4); ctx.closePath(); ctx.fill();
    ctx.restore();
  };

  for(const a of localArrows){
    const dx = wrapDelta(a.x, cam.x), dy = wrapDelta(a.y, cam.y);
    const rx = cam.x + dx, ry = cam.y + dy;
    if(rx < camLeft-100 || rx > camRight+100 || ry < camTop-100 || ry > camBottom+100) continue;
    drawArrowAt(rx, ry, a.angle, a.hue);
  }
  for(const [, a] of NET.remoteArrows){
    if(a.curr.ownerId === NET.myId) continue;
    const dx = wrapDelta(a.x, cam.x), dy = wrapDelta(a.y, cam.y);
    const rx = cam.x + dx, ry = cam.y + dy;
    if(rx < camLeft-100 || rx > camRight+100 || ry < camTop-100 || ry > camBottom+100) continue;
    drawArrowAt(rx, ry, a.angle, a.curr.h);
  }

  for(const [, rp] of NET.remotePlayers){
    const c = rp.curr;
    if(!c.al) continue;
    const dx = wrapDelta(rp.x, cam.x), dy = wrapDelta(rp.y, cam.y);
    const rx = cam.x + dx, ry = cam.y + dy;
    if(rx < camLeft-200 || rx > camRight+200 || ry < camTop-200 || ry > camBottom+200) continue;
    const attacking = c.sw === 1;
    const prog = attacking ? clamp(1 - Math.max(0, (performance.now() - NET.lastSnapAt)/160), 0, 1) : 0;
    drawWarrior(rx, ry, rp.angle, c.wp || 0, attacking, prog, c.h || 205, c.lv || 1, c.c);
    ctx.save();
    ctx.font = 'bold 11px Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,0.75)';
    ctx.lineWidth = 3;
    ctx.strokeText(c.n || '?', rx, ry - 30);
    ctx.fillStyle = 'hsla('+(c.h||205)+',90%,80%,0.95)';
    ctx.fillText(c.n || '?', rx, ry - 30);
    if(typeof c.hp === 'number' && typeof c.mhp === 'number' && c.hp < c.mhp){
      const bw = 30, bh = 3;
      const bx = rx - bw/2, by = ry - 24;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(bx, by, bw, bh);
      const pct = clamp(c.hp / c.mhp, 0, 1);
      ctx.fillStyle = pct > 0.5 ? '#6dff8c' : pct > 0.25 ? '#ffd76a' : '#ff5a5a';
      ctx.fillRect(bx, by, bw * pct, bh);
    }
    ctx.restore();
  }

  /* ============ LOCAL PLAYER ============ */
  if(player.alive && isFinite(player.x) && isFinite(player.y)){
    const prx = cam.x + wrapDelta(player.x, cam.x);
    const pry = cam.y + wrapDelta(player.y, cam.y);
    const attacking = player.swing > 0;
    const prog = attacking ? 1 - player.swing/0.16 : 0;

    drawWarrior(prx, pry, player.angle, player.walkPhase,
                attacking, prog, player.hue, player.level, player.charId);

    if(player.spawnProt > 0){
      ctx.save();
      ctx.translate(prx, pry);
      ctx.strokeStyle = 'rgba(140,220,255,'+(0.35 + 0.4*Math.sin(time*18))+')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0,0, 26, 0, TAU); ctx.stroke();
      ctx.restore();
    }
    if(player.charId === 'tank'){
      ctx.save();
      ctx.translate(prx, pry);
      ctx.globalCompositeOperation = 'lighter';
      const charge = player.shieldCharge;
      const rot = time * 1.6;
      for(let i=0; i<4; i++){
        const a = rot + i*Math.PI/2;
        ctx.fillStyle = 'hsla('+player.hue+',90%,'+(55+charge*25)+'%,'+(0.35+charge*0.55)+')';
        ctx.beginPath(); ctx.arc(Math.cos(a)*30, Math.sin(a)*30, 3.5+charge*3, 0, TAU); ctx.fill();
      }
      ctx.strokeStyle = 'hsla('+player.hue+',90%,70%,'+(0.12+charge*0.35)+')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0,0,30,0,TAU); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
    }
    if(attacking && player.charId !== 'archer'){
      const alpha = player.swing / 0.16;
      const rr = CFG.swordRange * (CHARACTERS[player.charId].range || 1);
      ctx.save();
      ctx.translate(prx, pry);
      ctx.rotate(player.swingDir);
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.arc(0, 0, rr*0.92, -CFG.swordArc, CFG.swordArc);
      ctx.strokeStyle = 'rgba(180,230,255,'+(alpha*0.65)+')';
      ctx.lineWidth = 14; ctx.lineCap = 'round';
      ctx.shadowBlur = 22; ctx.shadowColor = 'rgba(120,200,255,1)';
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  for(const [, e] of NET.remoteEnemies){
    const c = e.curr;
    if(!c || !c.hp || !c.mhp || c.mhp <= 1 || c.hp >= c.mhp) continue;
    const dx = wrapDelta(e.x, cam.x), dy = wrapDelta(e.y, cam.y);
    const wx = cam.x + dx, wy = cam.y + dy;
    const t = MONSTER_TYPES[c.ty];
    if(!t) continue;
    const barW = t.radius * 1.6;
    const barH = 3;
    const pct2 = clamp(c.hp / c.mhp, 0, 1);
    const bx = wx - barW / 2;
    const by = wy - t.radius - 10;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(bx, by, barW, barH);
    ctx.fillStyle = pct2 > 0.5 ? '#6dff8c' : pct2 > 0.25 ? '#ffd76a' : '#ff5a5a';
    ctx.fillRect(bx, by, barW * pct2, barH);
  }

  ctx.restore();

  const vg = ctx.createRadialGradient(W/2,H/2, Math.min(W,H)*0.34, W/2,H/2, Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.62)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  if(screenFlash > 0){
    ctx.fillStyle = 'rgba(255,225,150,'+(screenFlash*0.28)+')';
    ctx.fillRect(0,0,W,H);
  }

  drawJoystick();
  drawButtons();
  drawMinimap();

  if(!player.alive && gameActive){
    const a = 0.5 + 0.5*Math.sin(time*3);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold clamp(28px,6vw,42px) Tahoma, sans-serif';
    ctx.fillStyle = 'rgba(255,90,90,'+(0.72 + 0.24*a)+')';
    ctx.shadowBlur = 30;
    ctx.shadowColor = 'rgba(255,60,60,0.9)';
    ctx.fillText('شما نابود شدید', W/2, H/2 - 40);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 18px Tahoma, sans-serif';
    ctx.fillStyle = 'rgba(200,220,255,0.85)';
    ctx.fillText('بازگشت تا ' + player.respawn.toFixed(1) + ' ثانیه', W/2, H/2 + 14);
    ctx.font = 'bold 14px Tahoma, sans-serif';
    ctx.fillStyle = 'rgba(255,180,180,0.9)';
    ctx.fillText('تمام سطح و ویژگی‌ها از دست می‌رود!', W/2, H/2 + 44);
    ctx.restore();
  }
}

function drawJoystick(){
  const {baseX, baseY, radius} = joy;
  const kx = joy.displayX, ky = joy.displayY;
  const active = joy.active;
  const a = active ? 1 : 0.5;
  ctx.save();
  ctx.globalAlpha = a;
  const ring = ctx.createRadialGradient(baseX, baseY, radius*0.3, baseX, baseY, radius);
  ring.addColorStop(0, 'rgba(30,50,90,0.35)');
  ring.addColorStop(1, 'rgba(120,180,255,0.10)');
  ctx.fillStyle = ring;
  ctx.beginPath(); ctx.arc(baseX, baseY, radius, 0, TAU); ctx.fill();
  ctx.strokeStyle = active ? 'rgba(140,200,255,0.75)' : 'rgba(140,200,255,0.42)';
  ctx.lineWidth = 2.4; ctx.stroke();
  const knobGrad = ctx.createRadialGradient(kx-7, ky-7, 2, kx, ky, radius*0.48);
  knobGrad.addColorStop(0, 'rgba(230,245,255,0.98)');
  knobGrad.addColorStop(0.5, 'rgba(120,190,255,0.92)');
  knobGrad.addColorStop(1, 'rgba(40,90,180,0.82)');
  ctx.fillStyle = knobGrad;
  ctx.beginPath(); ctx.arc(kx, ky, radius*0.44, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawButtons(){
  const atkReady = player.atkCd <= 0;
  const atkPressed = btn.atkPressed;
  ctx.save();
  const bodyGrad = ctx.createRadialGradient(
    btn.atkX - btn.atkR*0.3, btn.atkY - btn.atkR*0.3, btn.atkR*0.15,
    btn.atkX, btn.atkY, btn.atkR);
  if(atkReady){
    bodyGrad.addColorStop(0, atkPressed ? 'rgba(255,255,220,1)' : 'rgba(255,220,170,0.95)');
    bodyGrad.addColorStop(0.5, atkPressed ? 'rgba(255,150,90,1)' : 'rgba(230,110,60,0.92)');
    bodyGrad.addColorStop(1, 'rgba(140,40,20,0.92)');
  } else {
    bodyGrad.addColorStop(0, 'rgba(90,90,100,0.75)');
    bodyGrad.addColorStop(1, 'rgba(40,45,55,0.75)');
  }
  ctx.fillStyle = bodyGrad;
  ctx.beginPath(); ctx.arc(btn.atkX, btn.atkY, btn.atkR * (atkPressed ? 0.94 : 1), 0, TAU); ctx.fill();
  ctx.strokeStyle = atkReady ? 'rgba(255,220,150,0.95)' : 'rgba(160,170,190,0.6)';
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(btn.atkX, btn.atkY, btn.atkR, 0, TAU); ctx.stroke();
  ctx.fillStyle = atkReady ? '#fff' : 'rgba(220,225,235,0.7)';
  ctx.font = 'bold ' + Math.round(btn.atkR*0.45) + 'px Tahoma, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('حمله', btn.atkX, btn.atkY);
  if(!atkReady){
    const cd = clamp(1 - player.atkCd / (CFG.swordCd * (CHARACTERS[player.charId].cd||1)), 0, 1);
    ctx.strokeStyle = 'rgba(255,200,120,0.85)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(btn.atkX, btn.atkY, btn.atkR + 5, -Math.PI/2, -Math.PI/2 + TAU*cd);
    ctx.stroke();
  }
  const dashReady = player.dashCd <= 0;
  const dashPressed = btn.dashPressed;
  const dg = ctx.createRadialGradient(
    btn.dashX - btn.dashR*0.3, btn.dashY - btn.dashR*0.3, btn.dashR*0.15,
    btn.dashX, btn.dashY, btn.dashR);
  if(dashReady){
    dg.addColorStop(0, dashPressed ? 'rgba(255,255,255,1)' : 'rgba(200,240,255,0.95)');
    dg.addColorStop(0.55, dashPressed ? 'rgba(120,200,255,1)' : 'rgba(70,150,240,0.92)');
    dg.addColorStop(1, 'rgba(20,50,120,0.9)');
  } else {
    dg.addColorStop(0, 'rgba(90,90,110,0.7)');
    dg.addColorStop(1, 'rgba(35,40,55,0.7)');
  }
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.arc(btn.dashX, btn.dashY, btn.dashR * (dashPressed ? 0.94 : 1), 0, TAU); ctx.fill();
  ctx.strokeStyle = dashReady ? 'rgba(180,230,255,0.9)' : 'rgba(150,160,180,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(btn.dashX, btn.dashY, btn.dashR, 0, TAU); ctx.stroke();
  ctx.fillStyle = dashReady ? '#fff' : 'rgba(220,225,235,0.7)';
  ctx.font = 'bold ' + Math.round(btn.dashR*0.42) + 'px Tahoma, sans-serif';
  ctx.fillText('جهش', btn.dashX, btn.dashY);
  if(!dashReady){
    // ✅ ضریب شخصیت
    const cd = clamp(1 - player.dashCd / pDashCdClient(player.charId), 0, 1);
    ctx.strokeStyle = 'rgba(140,220,255,0.85)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(btn.dashX, btn.dashY, btn.dashR + 4, -Math.PI/2, -Math.PI/2 + TAU*cd);
    ctx.stroke();
  }
  ctx.restore();
}

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR);
  canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  computeViewScale();
  updateUILayout();
  setupMinimap();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize, 150));

/* ============ MENU ============ */
const menuEl = document.getElementById('menu');
const playBtn = document.getElementById('playBtn');
const nameInput = document.getElementById('nameInput');
const serverInput = document.getElementById('serverInput');
const connMsg = document.getElementById('connMsg');

const savedName = storage.get('oha_name'); if(savedName) nameInput.value = savedName;
const savedServer = storage.get('oha_server'); if(savedServer) serverInput.value = savedServer;
else serverInput.value = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
nameInput.addEventListener('input', ()=> storage.set('oha_name', nameInput.value));
serverInput.addEventListener('input', ()=> storage.set('oha_server', serverInput.value));

async function startGame(){
  initAudio();
  if(actx && actx.state === 'suspended') actx.resume();
  resetInput();
  const nm = (nameInput.value || '').trim() || 'Player';

  playBtn.disabled = true;
  playBtn.textContent = 'در حال شروع...';
  connMsg.textContent = '';
  NET._intentionalClose = false;
  NET._reconnectAttempts = 0;

  try {
    if(selectedMode === 'offline'){
      WSZ = CFG.worldSize;
      startOfflineMode(nm, selectedChar, selectedTeam, selectedColor);
    } else {
      const url = (serverInput.value || '').trim();
      if(!url) throw new Error('آدرس سرور را وارد کنید');
      await connectToServer(url, nm, selectedChar, selectedTeam, selectedColor);
    }
  } catch(e){
    playBtn.disabled = false;
    playBtn.textContent = 'شروع بازی';
    connMsg.textContent = e.message || e;
    return;
  }

  NET.remotePlayers.clear();
  NET.remoteEnemies.clear();
  NET.remoteArrows.clear();
  NET.leaderboard = [];
  particles.length = 0;
  rings.length = 0;
  localArrows.length = 0;
  chatBox.innerHTML = '';

  player.name = nm;
  player.charId = selectedChar;
  player.char = CHARACTERS[selectedChar];
  player.hue = (selectedColor !== 'auto')
    ? parseInt(selectedColor, 10)
    : (selectedTeam !== 'ffa' ? TEAMS[selectedTeam].hue : CHARACTERS[selectedChar].hue);
  player.team = selectedTeam;
  player.kills = 0; player.deaths = 0;
  player.level = 1; player.xp = 0; player.xpNeed = xpForLevel(1);
  player.atkCd = 0; player.swing = 0;
  player.dashCd = 0; player.dashTime = 0;
  player.walkPhase = 0;
  player._dashLockUntil = 0;
  player.shieldCharge = CHARACTERS[selectedChar].shield ? 1 : 0;
  player.maxHp = pMaxHpClient(1);
  player.hp = player.maxHp;
  player.damage = pDamageClient(1);
  player.alive = true;

  menuEl.classList.add('hide');
  setTimeout(()=>{ menuEl.style.display = 'none'; }, 560);
  hudEl.classList.remove('off');
  document.getElementById('statBar').classList.remove('off');
  document.getElementById('disconnectOverlay').classList.remove('on');
  gameActive = true;
  playBtn.disabled = false;
  playBtn.textContent = 'شروع بازی';

  const discBtn = document.getElementById('discReconnectBtn');
  if(discBtn && !discBtn._wired){
    discBtn._wired = true;
    discBtn.addEventListener('click', ()=>{
      if(!NET._reconnectInfo) return;
      if(NET._reconnectTimer){ clearTimeout(NET._reconnectTimer); NET._reconnectTimer = null; }
      NET._reconnectAttempts = 0;
      NET._intentionalClose = false;
      document.getElementById('discStatus').textContent = 'در حال اتصال...';
      const info = NET._reconnectInfo;
      connectToServer(info.url, info.name, info.charId, info.team, info.color)
        .then(()=>{ NET._reconnectAttempts = 0; })
        .catch(()=> scheduleReconnect());
    });
  }
}
playBtn.addEventListener('click', startGame);
playBtn.addEventListener('touchend', (e)=>{ e.preventDefault(); startGame(); }, {passive:false});

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(typeof r === 'number') r = [r,r,r,r];
    this.beginPath();
    this.moveTo(x+r[0],y);
    this.lineTo(x+w-r[1],y);
    this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
    this.lineTo(x+w,y+h-r[2]);
    this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
    this.lineTo(x+r[3],y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
    this.lineTo(x,y+r[0]);
    this.quadraticCurveTo(x,y,x+r[0],y);
    this.closePath();
    return this;
  };
}

let last = performance.now();
let _loopErrorCount = 0;
function loop(now){
  let dt = (now - last)/1000;
  last = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;

  if(gameActive){
    try { update(dt); } catch(e){
      _loopErrorCount++;
      if(_loopErrorCount < 5) console.error('[update]', e.message);
      if(!isFinite(player.x)) player.x = WSZ/2;
      if(!isFinite(player.y)) player.y = WSZ/2;
      if(!isFinite(cam.x)) cam.x = WSZ/2;
      if(!isFinite(cam.y)) cam.y = WSZ/2;
      if(!isFinite(player.angle)) player.angle = 0;
    }
    try { render(); } catch(e){
      _loopErrorCount++;
      if(_loopErrorCount < 5) console.error('[render]', e.message);
      try { ctx.setTransform(DPR,0,0,DPR,0,0); } catch(_){}
      try { ctx.restore(); } catch(_){}
    }
  } else {
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    const bg = ctx.createRadialGradient(W/2,H/2,60, W/2,H/2,Math.max(W,H)*0.8);
    bg.addColorStop(0,'#0d1729'); bg.addColorStop(1,'#04060c');
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  }

  hudTimer -= dt;
  if(hudTimer <= 0){ hudTimer = 0.2; if(gameActive) try { updateHUD(); } catch(e){} }
  requestAnimationFrame(loop);
}

renderCharCards();
renderTeams();
renderColors();
renderModes();
resize();
setupMinimap();
requestAnimationFrame(loop);

})();
</script>
